<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>點名台 V19</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F3; --surface:#FFF; --surface2:#F6F8FA; --ink:#172033; --muted:#5E6878; --line:#D5DAE1;
  --brand:#2B3A8C; --brand-ink:#FFF;
  --up:#C8322B; --down:#1E8A55; --up-bg:#FBE9E7; --down-bg:#E3F3EA;
  --neutral:#7D8797; --neutral-bg:#ECEFF3;
  --num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#121826; --surface:#1A2233; --surface2:#20293C; --ink:#E6EAF2; --muted:#9AA4B5; --line:#2E3850;
  --brand:#7F92F0; --brand-ink:#0F1424;
  --up:#F0625A; --down:#3DBE7C; --up-bg:#3B1F22; --down-bg:#17352A; --neutral:#8F99AA; --neutral-bg:#262F43;
}}
:root[data-theme="dark"]{
  --bg:#121826; --surface:#1A2233; --surface2:#20293C; --ink:#E6EAF2; --muted:#9AA4B5; --line:#2E3850;
  --brand:#7F92F0; --brand-ink:#0F1424;
  --up:#F0625A; --down:#3DBE7C; --up-bg:#3B1F22; --down-bg:#17352A; --neutral:#8F99AA; --neutral-bg:#262F43;
}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 18px}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 0 14px}
header .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:22px}
header p{margin:2px 0 0;color:var(--muted);font-size:13px}
header .right{margin-left:auto}
.dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--neutral)}
.dot.on i{background:var(--down)}
.dot.bad i{background:var(--up)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:500}
.btn.big{padding:12px 26px;font-size:16px}
.btn.small{padding:3px 10px;font-size:13px}
.btn.ghost{background:none}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:5px 12px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.hint{color:var(--muted);font-size:13px}
main{padding:18px 0 60px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.grow{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
textarea{width:100%;min-height:150px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;font-size:13.5px;line-height:1.5;resize:vertical;color:var(--ink)}
.status{font-size:14px;min-height:1.5em;margin-top:8px;white-space:pre-wrap;word-break:break-word}
.status.err{color:var(--up)}
progress{width:100%;height:6px;margin-top:8px}
.pulse{display:flex;gap:26px;flex-wrap:wrap;padding:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;align-items:center}
.pulse .k{font-size:12px;color:var(--muted)}
.pulse .v{font-family:var(--num);font-size:28px;font-weight:700;line-height:1.1}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-family:var(--num);font-weight:600;font-size:14px;padding:0 8px;border-radius:6px;line-height:1.6;white-space:nowrap}
.tag.bull{background:var(--up-bg);color:var(--up)}
.tag.bear{background:var(--down-bg);color:var(--down)}
.tag.neutral{background:var(--neutral-bg);color:var(--neutral)}
.call{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--neutral);border-radius:14px;padding:15px 17px;margin-bottom:11px}
.call.bull{border-left-color:var(--up)}
.call.bear{border-left-color:var(--down)}
.call .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.call .target{font-size:23px;font-weight:700;line-height:1.25}
.call .kind{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 9px}
.call .verdict{margin-left:auto;font-family:var(--num);font-size:26px;font-weight:700;letter-spacing:.06em;padding:0 12px;border-radius:8px}
.call .verdict.bull{background:var(--up-bg);color:var(--up)}
.call .verdict.bear{background:var(--down-bg);color:var(--down)}
.call .verdict.neutral{background:var(--neutral-bg);color:var(--neutral)}
.call .quote{margin:10px 0 0;padding-left:11px;border-left:3px solid var(--line);font-size:13.5px;color:var(--muted);line-height:1.55}
.call .zh{margin:5px 0 0;padding-left:11px;border-left:3px solid var(--line);font-size:14.5px}
.call .why{margin:9px 0 0;font-size:14px}
.call .rel{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
.call .rel .lab{font-size:12.5px;color:var(--muted)}
.call .src{margin-top:9px;font-size:12.5px;color:var(--muted)}
.call .src a{color:var(--brand);text-decoration:none;border-bottom:1px solid transparent}
.call .src a:hover{border-bottom-color:var(--brand)}
.call .foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;font-size:12.5px;color:var(--muted)}
.call .foot .ops{margin-left:auto;display:flex;gap:6px}
.tw{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line)}
.tw .lab{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tw .lab .th{color:var(--brand);font-weight:500;font-size:14px}
.tw .stocks{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tw a.st{display:inline-flex;gap:6px;align-items:baseline;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:4px 11px;background:var(--surface2);font-size:14px;color:var(--ink)}
.tw a.st:hover{border-color:var(--brand)}
.tw a.st b{font-family:var(--num);font-size:16px;font-weight:700}
.tw .note{font-size:12.5px;color:var(--muted);margin-top:7px}
a.btn{text-decoration:none;display:inline-block}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:34px 20px;text-align:center;color:var(--muted)}
.disc{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.6}
@media (max-width:640px){ .call .verdict{margin-left:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div>
    <h1>點名台 <span style="font-family:var(--num);font-size:17px;color:var(--muted);font-weight:600">V19</span></h1>
    <p>川普與馬斯克點到名的公司、商品與產業，判多空，帶出對應的台股概念股。</p>
  </div>
  <div class="right"><span class="dot" id="syncDot"><i></i><span>連線中</span></span></div>
</div></header>

<main><div class="wrap">

  <div class="panel">
    <div class="bar" style="margin:0">
      <button class="btn primary big" id="update">更新</button>
      <label class="f">抓最近<select id="days">
        <option value="1">1 天</option><option value="3" selected>3 天</option>
        <option value="7">7 天</option><option value="14">14 天</option><option value="30">30 天</option>
      </select></label>
      <button class="btn ghost" id="stop" hidden>停止</button>
      <button class="btn ghost" id="pasteBtn">改用貼上</button>
      <span class="grow"></span>
      <span class="hint" id="lastRun"></span>
    </div>
    <progress id="prog" max="100" value="0" hidden></progress>
    <div class="status" id="status"></div>
    <div id="pasteWrap" hidden style="margin-top:12px">
      <p class="hint" style="margin:0 0 6px">開 <a href="https://www.trumpstruth.org/?per_page=50" target="_blank" rel="noopener">存檔站列表頁</a>，整頁全選複製（Ctrl+A、Ctrl+C），貼進來按解析。抓取失敗時用這個一定會通。</p>
      <textarea id="pasteText" placeholder="貼上存檔站頁面內容"></textarea>
      <div class="bar" style="margin:8px 0 0">
        <label class="f">誰講的<select id="pasteWho"></select></label>
        <button class="btn primary" id="pasteRun">解析並寫入</button>
      </div>
    </div>
  </div>

  <div id="pulse"></div>

  <div class="bar">
    <div class="seg" role="group" aria-label="篩選" id="filterSeg">
      <button data-f="all" aria-pressed="true">全部</button>
      <button data-f="bull" aria-pressed="false">多</button>
      <button data-f="bear" aria-pressed="false">空</button>
    </div>
    <select id="who" aria-label="人物"><option value="">所有人</option></select>
    <input type="text" id="q" placeholder="搜尋標的、主題或股號" style="min-width:190px">
    <span class="grow"></span>
    <span class="hint" id="count"></span>
  </div>

  <div id="list"></div>
  <p class="disc">資料來源為 Truth Social 公開存檔（含影片逐字稿與圖片文字）。多空與概念股為依發言內容推估，僅供追蹤參考，不是投資建議。</p>

</div></main>

<script>
(() => {
"use strict";

/* ===================================================================
   後台設定：只改這一段。其餘不用動。
   1. firebaseUrl 填你的 Realtime Database 網址。
   2. AI 的 key 不要寫在這裡（這是公開網頁），放 Firebase：
      /<firebasePath>/config = {"provider":"gemini","model":"gemini-2.5-flash","key":"你的key"}
      provider 可填 gemini 或 openai；openai 時再加 "baseUrl"。
   3. 概念股對照表放 Firebase：/<firebasePath>/themes （純文字，一行一個主題）
      格式：主題 | 觸發關鍵詞,逗號分隔 | 2330 台積電;2303 聯電
      第一次開啟若 Firebase 沒有 themes，會自動把內建預設寫上去，之後你在後台改。
   =================================================================== */
const CONFIG = {
  firebaseUrl: "https://presskit-96e01-default-rtdb.asia-southeast1.firebasedatabase.app",
  firebasePath: "PRESS_KIT/trumpcalls/trumpcalls",
  firebaseAuth: "",                // 規則需要驗證時才填
  proxy: "auto",                   // auto / direct / allorigins / corsproxy / jina
  maxPosts: 25
};
/* =================================================================== */

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FEED = "https://www.trumpstruth.org/feed";
const VERDICT = { bull:"多", bear:"空", neutral:"中性" };
const LS_CACHE = "trumpcalls.cache.v3";
const safeKey = s => String(s).replace(/[.#$\[\]\/]/g, "_").slice(0, 160);
let AI = { provider:"gemini", model:"gemini-2.5-flash", key:"", baseUrl:"https://api.openai.com/v1" };

/* ---------- 內建預設對照表（Firebase 沒有時才用） ---------- */
const DEFAULT_THEMES = `#v2
無人機 | drone,drones,UAV,unmanned aircraft,無人機 | 8033 雷虎;5371 中光電;2634 漢翔;2645 長榮航太
稀土磁材 | rare earth,rare earths,magnet,magnets,neodymium,permanent magnet,稀土,磁鐵 | 3311 閎暉;1609 大亞;2049 上銀;2308 台達電
半導體 | semiconductor,chip,chips,fab,wafer,Nvidia,TSMC,Intel,AMD,晶片,半導體 | 2330 台積電;2303 聯電;2454 聯發科;3711 日月光投控
AI 伺服器 | AI,artificial intelligence,superintelligence,data center,data centers,xAI,Grok,OpenAI,Colossus,算力,資料中心 | 2382 廣達;3231 緯創;6669 緯穎;2317 鴻海
散熱 | cooling,liquid cooling,thermal,散熱 | 3017 奇鋐;3324 雙鴻;2421 建準
電力與重電 | electricity,power grid,grid,transformer,nuclear,SMR,electricity prices,battery,Megapack,電網,電價,核能 | 2308 台達電;1519 華城;1503 士電;1513 中興電
網通 | network,switch,broadband,5G,網通 | 2345 智邦;3596 智易;5388 中磊
低軌衛星 | satellite,satellites,low earth orbit,Starlink,Starshield,衛星 | 3491 昇達科;3419 譁裕;6285 啟碁
資安 | cybersecurity,cyber attack,hacking,資安 | 6690 安碁資訊;6214 精誠;3029 零壹
電線電纜與銅 | copper,cable,wire,銅,電纜 | 1609 大亞;1605 華新;1612 宏泰
航太與國防 | Boeing,aircraft,airplanes,defense,munitions,military,missile,SpaceX,rocket,launch,Starship,航太,國防 | 2634 漢翔;2645 長榮航太;8222 寶一;2630 亞航
造船 | shipbuilding,shipyard,navy ships,造船 | 2208 台船
鋼鐵 | steel,aluminum,鋼,鋁 | 2002 中鋼;2014 中鴻;2015 豐興
航運 | shipping,container,port fees,航運 | 2603 長榮;2609 陽明;2615 萬海
塑化與石油 | oil,crude,diesel,refinery,drilling,gas prices,石油,柴油 | 1301 台塑;6505 台塑化;1326 台化
農業與飼料 | farm bill,farmers,ranchers,soybean,corn,agriculture,農業 | 1210 大成;1215 卜蜂;1219 福壽
肥料 | potash,fertilizer,鉀肥,肥料 | 1722 台肥
機器人與自動化 | robot,robots,robotics,automation,Optimus,humanoid,機器人 | 2049 上銀;1590 亞德客-KY;2359 所羅門
工具機 | machine tool,machine tools,CNC,工具機 | 1583 程泰;1530 亞崴;2049 上銀
太陽能 | solar,photovoltaic,太陽能 | 6443 元晶;6477 安集
風電 | wind,offshore wind,風電 | 9958 世紀鋼;3708 上緯投控
生技製藥 | drug prices,pharmaceutical,prescription,FDA,藥價,製藥 | 6472 保瑞;1795 美時
汽車與電動車 | automobile,auto tariffs,electric vehicle,EV,Tesla,Cybertruck,robotaxi,Model Y,汽車,電動車 | 1536 和大;3665 貿聯-KY;2231 為升
消費電子 | iPhone,Apple,smartphone,consumer electronics,Neuralink,手機 | 2317 鴻海;3008 大立光;3406 玉晶光
光通訊 | optical,fiber,光通訊 | 3081 聯亞;3163 波若威;4977 眾達-KY
紡織成衣 | textile,apparel,footwear,紡織,成衣 | 1476 儒鴻;1477 聚陽;9910 豐泰
自行車 | bicycle,bike,自行車 | 9921 巨大;9914 美利達
水泥與基建 | infrastructure,cement,construction,基建,水泥 | 1101 台泥;1102 亞泥;2515 中工
加密貨幣 | bitcoin,crypto,cryptocurrency,digital asset,加密貨幣 | 
量子運算 | quantum,quantum computing,量子 | `;

const DEFAULT_SOURCES = `川普 | archive | 本人發文 | https://www.trumpstruth.org/?per_page=100
馬斯克 | news | 新聞報導 | https://news.google.com/rss/search?q=%22Elon+Musk%22+when:7d&hl=en-US&gl=US&ceid=US:en`;
let SOURCE_RAW = DEFAULT_SOURCES, SOURCES = [];
function parseSources(raw){
  return String(raw||"").split("\n").map(line => {
    const [person, kind, note, url] = line.split("|").map(x => (x||"").trim());
    if (!person || !url) return null;
    return { person, kind: kind === "news" ? "news" : "archive", note: note || "", url };
  }).filter(Boolean);
}
function refreshSources(){ SOURCES = parseSources(SOURCE_RAW); }
refreshSources();

let THEME_RAW = DEFAULT_THEMES, THEMES = [];
function parseThemes(raw){
  return String(raw||"").split("\n").map(line => {
    const [name, kw, stocks] = line.split("|").map(x => (x||"").trim());
    if (!name) return null;
    return { name,
      kw:(kw||"").split(",").map(x=>x.trim().toLowerCase()).filter(Boolean),
      stocks:(stocks||"").split(";").map(x=>x.trim()).filter(Boolean).map(x => {
        const m = x.match(/^(\S+)\s+(.+)$/); return m ? { code:m[1], name:m[2] } : { code:x, name:"" };
      }) };
  }).filter(Boolean);
}
function refreshThemes(){ THEMES = parseThemes(THEME_RAW); }
refreshThemes();
function matchTheme(c){
  if (c.theme){ const hit = THEMES.find(t => t.name === c.theme); if (hit) return hit; }
  const hay = [c.target, c.targetEn, c.quote, c.why].join(" ").toLowerCase();
  return THEMES.find(t => t.kw.some(k => k && hay.includes(k))) || null;
}

/* ---------- 狀態 ---------- */
let CALLS = {}, SEEN = {}, LAST = "";
try { const o = JSON.parse(localStorage.getItem(LS_CACHE) || "{}"); CALLS = o.calls||{}; SEEN = o.seen||{}; LAST = o.last||""; } catch(e){}
function cache(){ try { localStorage.setItem(LS_CACHE, JSON.stringify({ calls:CALLS, seen:SEEN, last:LAST })); } catch(e){} }
function setStatus(m, err){ const el = $("#status"); el.textContent = m || ""; el.classList.toggle("err", !!err); }
function dot(state, text){ const d = $("#syncDot"); d.className = "dot" + (state ? " " + state : ""); d.lastElementChild.textContent = text; }

/* ---------- Firebase REST ---------- */
const fbOn = () => !!CONFIG.firebaseUrl;
function fbURL(sub){
  if (!fbOn()) return null;
  const q = CONFIG.firebaseAuth ? "?auth=" + encodeURIComponent(CONFIG.firebaseAuth) : "";
  return `${CONFIG.firebaseUrl.replace(/\/$/,"")}/${CONFIG.firebasePath}/${sub}.json${q}`;
}
async function fbGet(sub){
  const u = fbURL(sub); if (!u) return null;
  const r = await fetch(u); if (!r.ok) throw new Error("Firebase 讀取失敗 " + r.status);
  return await r.json();
}
async function fbPut(sub, data){
  const u = fbURL(sub); if (!u) return;
  const r = await fetch(u, { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(data) });
  if (!r.ok) throw new Error("Firebase 寫入失敗 " + r.status);
}

async function boot(){
  render();
  if (!fbOn()){ dot("bad","未設定後台"); setStatus("這份檔案還沒填 Firebase 網址，請在原始碼最上面的 CONFIG 填好再上架。", true); return; }
  dot("", "讀取後台…");
  try{
    const [cfg, th, sr, c, s] = await Promise.all([fbGet("config"), fbGet("themes"), fbGet("sources"), fbGet("calls"), fbGet("seen")]);
    if (typeof sr === "string" && sr.trim()){ SOURCE_RAW = sr; refreshSources(); }
    else { try{ await fbPut("sources", DEFAULT_SOURCES); }catch(e){} }
    if (cfg && cfg.key){
      AI = { ...AI, ...cfg };
      AI.key = String(AI.key).trim().replace(/^["']|["']$/g, "");
      AI.model = String(AI.model || "gemini-2.5-flash").trim();
    }
    if (typeof th === "string" && th.trim()){
      if (!th.includes("#v2")){
        try{ await fbPut("themes_backup", th); await fbPut("themes", DEFAULT_THEMES); THEME_RAW = DEFAULT_THEMES; refreshThemes();
          setStatus("對照表已更新到新版（多了 Tesla、SpaceX 等關鍵詞），舊的存在 themes_backup。");
        }catch(e){ THEME_RAW = th; refreshThemes(); }
      } else { THEME_RAW = th; refreshThemes(); }
    }
    else { try{ await fbPut("themes", DEFAULT_THEMES); setStatus("後台還沒有對照表，已寫入內建預設，之後在 Firebase 直接改。"); }catch(e){} }
    if (c && typeof c === "object") CALLS = { ...CALLS, ...c };
    if (s && typeof s === "object") SEEN = { ...SEEN, ...s };
    cache(); render();
    if (!AI.key){ dot("on","關鍵詞模式"); return; }
    dot("", "驗證 AI…");
    try{
      await callAI("Reply with the single word OK.", undefined);
      dot("on", `AI 判讀・${AI.model}`);
    }catch(e){ AI.key = ""; dot("on","關鍵詞模式"); setStatus("AI key 無效，已改用關鍵詞比對。" + e.message); }
  }catch(e){ dot("bad","後台連線失敗"); setStatus(e.message, true); }
}

/* ---------- 抓取（RSS / HTML / markdown 多重策略） ---------- */
const FEED_HTML = "https://www.trumpstruth.org/?per_page=100";
const PROXIES = {
  direct: u => u,
  allorigins: u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  corsproxy: u => "https://corsproxy.io/?url=" + encodeURIComponent(u),
  jina: u => "https://r.jina.ai/" + u,
  codetabs: u => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
  allorigins2: u => "https://api.allorigins.win/get?url=" + encodeURIComponent(u)
};
const MONTHS = "Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec";
const MON_RE = `(?:${MONTHS})[a-z]*\\.?`;
// 兩種日期寫法都吃：網頁版「September 23, 2026, 8:19 PM」與 RSS 版「Thu, 24 Sep 2026 01:51:54 +0000」
const DATE_RE = new RegExp(
  `(?:(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun),\\s+\\d{1,2}\\s+${MON_RE}\\s+\\d{4}\\s+\\d{1,2}:\\d{2}(?::\\d{2})?\\s*(?:[+-]\\d{4}|GMT|UTC)?)` +
  `|(?:${MON_RE}\\s+\\d{1,2},\\s+\\d{4},?\\s*(?:\\d{1,2}:\\d{2}\\s*(?:AM|PM))?)`, "g");

function parseRSS(txt){
  const doc = new DOMParser().parseFromString(txt, "text/xml");
  if (doc.querySelector("parsererror")) return [];
  return Array.from(doc.querySelectorAll("item, entry")).map(it => {
    const get = t => it.querySelector(t)?.textContent?.trim() || "";
    const link = get("link") || it.querySelector("link")?.getAttribute("href") || "";
    const tmp = document.createElement("div");
    tmp.innerHTML = get("description") || get("content") || get("summary") || get("title");
    const text = (tmp.textContent || "").replace(/[ \t]{2,}/g," ").trim();
    const d = new Date(get("pubDate") || get("updated") || get("published") || Date.now());
    return { id: safeKey(get("guid") || link || text.slice(0,50)), link, text, ts: isNaN(d) ? Date.now() : d.getTime() };
  }).filter(p => p.text && p.text.length > 1);
}
function toText(raw){
  if (raw.trim().startsWith("<")){
    const doc = new DOMParser().parseFromString(raw, "text/html");
    doc.querySelectorAll("script,style,nav,header,footer").forEach(n => n.remove());
    return doc.body ? doc.body.textContent : raw;
  }
  return raw;
}
function cleanChunk(t){
  return t
    .replace(/^\s*\]\([^)]*\)/, " ")
    .replace(/^#{1,6}\s*/gm, " ")
    .replace(/Title:|URL Source:|Published Time:|Markdown Content:/g, " ")
    .replace(/!\[[^\]]*\]\([^)]*\)/g, " ")                 // markdown 圖片
    .replace(/\[([^\]]*)\]\([^)]*\)/g, "$1")               // markdown 連結
    .replace(/https?:\/\/\S+/g, " ")
    .replace(/Original Post|Donald J\. Trump|@realDonaldTrump|Share:|Copy link|Show More|\+ Show More|Download (?:video|image)|ReTruthed/g, " ")
    .replace(/\s*·\s*\[?\s*$/, "")
    .replace(/[ \t]{2,}/g, " ")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}
function parseLoose(raw){
  const src = raw;
  const text = toText(raw);
  // 先抓出 markdown 版的 (日期, statuses 連結) 配對，方便給 id 與原文連結
  const idByDate = {};
  const linkRe = new RegExp(`\\[(${MON_RE}\\s+\\d{1,2},\\s+\\d{4}[^\\]]*)\\]\\((https?://[^)]*?/statuses/(\\d+))\\)`, "g");
  let lm;
  while ((lm = linkRe.exec(src)) !== null) idByDate[lm[1].trim()] = { link: lm[2], id: lm[3] };

  // RSS 版的 markdown 是「[](statuses/ID) ... 日期」，先依出現順序收集 id
  const idPos = [];
  const idRe = /https?:\/\/[^\s)\]]*?\/statuses\/(\d+)/g;
  let im;
  while ((im = idRe.exec(src)) !== null){
    if (!idPos.length || idPos[idPos.length-1].id !== im[1]) idPos.push({ id: im[1], at: im.index });
  }
  const idNear = pos => {
    let before = null;
    for (const x of idPos){ if (x.at < pos) before = x; else break; }
    if (before && pos - before.at < 400) return before.id;       // RSS 版：連結在日期前
    const after = idPos.find(x => x.at >= pos && x.at - pos < 400);
    return after ? after.id : null;                               // 網頁版：連結在日期後
  };

  DATE_RE.lastIndex = 0;
  const marks = [];
  let m;
  while ((m = DATE_RE.exec(text)) !== null) marks.push({ index: m.index, len: m[0].length, raw: m[0] });
  const out = [];
  for (let i = 0; i < marks.length; i++){
    const a = marks[i], b = marks[i+1];
    const chunk = cleanChunk(text.slice(a.index + a.len, b ? b.index : text.length));
    if (!chunk || chunk.length < 3) continue;
    const rawDate = a.raw.replace(/\./g,"").trim();
    let d = /^(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun),/.test(rawDate)
      ? new Date(rawDate)                                   // RSS 版自帶時區
      : new Date(rawDate + " GMT-0400");                    // 網頁版是美東時間
    if (isNaN(d)) d = new Date(rawDate);
    const hit = idByDate[a.raw.trim()];
    const seqId = idNear(a.index);
    const sid = hit ? hit.id : seqId;
    out.push({ id: safeKey(sid ? "ts" + sid : a.raw + "-" + chunk.slice(0,40)),
      link: hit ? hit.link : (sid ? "https://www.trumpstruth.org/statuses/" + sid : ""),
      text: chunk.slice(0, 4000), ts: isNaN(d) ? Date.now() : d.getTime() });
  }
  return out;
}
function parseByHandle(raw){
  const text = toText(raw);
  const parts = text.split(/@realDonaldTrump/).slice(1);
  const out = [];
  parts.forEach((chunk, i) => {
    const t = cleanChunk(chunk.slice(0, 2500));
    if (t && t.length > 25) out.push({ id: safeKey("h-" + i + "-" + t.slice(0,40)), link:"", text:t, ts: Date.now() });
  });
  return out;
}
let SAMPLES = [];
const SIGNOFF = /(President DONALD J\. TRUMP|President DJT|Thank you for your attention to this matter[!.]?)/g;
function parseBySignoff(raw){
  const text = toText(raw);
  const parts = text.split(SIGNOFF).filter(x => x && !SIGNOFF.test(x));
  const out = [];
  parts.forEach((chunk, i) => {
    const t = cleanChunk(chunk);
    if (t.length > 60) out.push({ id: safeKey("so-" + t.slice(0,60)), link:"", text:t.slice(0,4000), ts: Date.now() - i*60000, noDate:true });
  });
  return out;
}
function parseByParagraph(raw){
  const text = toText(raw);
  const out = [];
  text.split(/\n{2,}/).forEach((chunk, i) => {
    const t = cleanChunk(chunk);
    if (t.length > 120) out.push({ id: safeKey("pg-" + t.slice(0,60)), link:"", text:t.slice(0,4000), ts: Date.now() - i*60000, noDate:true });
  });
  return out;
}
function looksReal(p){
  if (p.kind === "news") return (p.text.match(/[A-Za-z]{2,}/g)||[]).length >= 5;
  const words = (p.text.match(/[A-Za-z]{2,}/g) || []).length;
  const letters = (p.text.match(/[A-Za-z]/g) || []).length;
  return words >= 12 && letters >= 60;
}
function goodBatch(posts){
  const ok = posts.filter(looksReal);
  if (!ok.length) return [];
  if (ok.length === 1 && (ok[0].text.match(/[A-Za-z]/g)||[]).length < 200) return [];
  return ok;
}
async function fetchNews(src, signal){
  const order = CONFIG.proxy === "auto" ? ["jina","direct","allorigins","codetabs"] : [CONFIG.proxy];
  for (const via of order){
    try{
      const res = await fetch(PROXIES[via](src.url), { signal });
      if (!res.ok) continue;
      const raw = await res.text();
      const posts = parseRSS(raw).map(p => {
        const m = p.text.match(/^(.*)\s[-–—]\s([^-–—]{2,40})$/);
        return { ...p, text: m ? m[1].trim() : p.text, outlet: m ? m[2].trim() : "",
          person: src.person, note: src.note, kind:"news" };
      });
      if (posts.length) return posts;
    }catch(e){ if (e.name === "AbortError") throw e; }
  }
  return [];
}
async function fetchPosts(signal){
  const plan = [
    { label:"列表頁 jina", url:FEED_HTML, via:"jina" },
    { label:"列表頁 直連", url:FEED_HTML, via:"direct" },
    { label:"RSS jina", url:FEED, via:"jina" },
    { label:"RSS 直連", url:FEED, via:"direct" },
    { label:"RSS allorigins", url:FEED, via:"allorigins" },
    { label:"RSS corsproxy", url:FEED, via:"corsproxy" },
    { label:"列表頁 allorigins", url:FEED_HTML, via:"allorigins" },
    { label:"列表頁 corsproxy", url:FEED_HTML, via:"corsproxy" },
    { label:"列表頁 codetabs", url:FEED_HTML, via:"codetabs" },
    { label:"RSS codetabs", url:FEED, via:"codetabs" },
    { label:"RSS allorigins(JSON)", url:FEED, via:"allorigins2" }
  ].filter(x => CONFIG.proxy === "auto" || x.via === CONFIG.proxy);
  const errs = [];
  for (const step of plan){
    try{
      setStatus(`抓取中…${step.label}`);
      const res = await fetch(PROXIES[step.via](step.url), { signal });
      if (!res.ok){ errs.push(`${step.label} → HTTP ${res.status}`); continue; }
      const raw = await res.text();
      if (!raw || raw.length < 200){ errs.push(`${step.label} → 回應太短`); continue; }
      let body = raw;
      if (step.via === "allorigins2"){
        try { body = JSON.parse(raw).contents || raw; } catch(e){}
      }
      let posts = goodBatch((body.includes("<item") || body.includes("<entry")) ? parseRSS(body) : []);
      if (!posts.length) posts = goodBatch(parseLoose(body));
      if (!posts.length) posts = goodBatch(parseBySignoff(body));
      if (!posts.length && body.includes("realDonaldTrump")) posts = goodBatch(parseByHandle(body));
      if (!posts.length) posts = goodBatch(parseByParagraph(body));
      if (posts.length) return { posts: posts.map(p => ({ ...p, person:"川普", note:"本人發文",
        link: p.link || FEED_HTML })), via: step.label };
      const sample = toText(body).replace(/\s+/g," ").trim();
      SAMPLES.push({ label: step.label, text: sample });
      errs.push(`${step.label} → 解析不出貼文`);
    }catch(e){
      if (e.name === "AbortError") throw e;
      errs.push(`${step.label} → ${e.message}`);
    }
  }
  // 程式切不開，但確實抓到內容 → 交給 AI 切割
  const best = SAMPLES.filter(x => x.text.length > 500).sort((a,b) => b.text.length - a.text.length)[0];
  if (best && AI.key){
    setStatus("格式不認得，改用 AI 切割…");
    try{
      const posts = await aiSplit(best.text, signal);
      if (posts.length) return { posts, via: best.label + " + AI 切割" };
    }catch(e){ if (e.name === "AbortError") throw e; errs.push("AI 切割 → " + e.message); }
  }
  const shown = SAMPLES.slice(0, 2).map(x => `【${x.label}】${x.text.slice(0, 260)}`).join("\n\n");
  throw new Error("都抓不到。" + errs.join("；") + (shown ? `\n\n抓回來的內容開頭：\n${shown}` : ""));
}

/* ---------- 不用 AI 的判讀：關鍵詞比對 ---------- */
const BULL_STEMS = ["buy","buying","purchas","order","invest","boost","expand","build","bring back","bringing back","support","subsid","protect","deal","signed","approv","record","increas","grow","growth","tax cut","cut taxes","lower rate","rate cut","drill","dominance","winning","leading","cherish","encourag","back to america","made in america","reshor","incentiv","contract"];
const BEAR_STEMS = ["tariff","ban ","banning","banned","investigat","sanction","halt","cancel","terminat","lawsuit","sue ","penalt","price gouging","too expensive","rip off","cut off","restrict","block","disaster","substantially less than","replac","reduc","cutting","curb","crack down","phase out"];
const esc_re = w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const stemRe = w => new RegExp((/\s$/.test(w) ? "\\b" + esc_re(w.trim()) + "\\b" : "\\b" + esc_re(w) + "\\w*"), "i");
const BULL_RE = BULL_STEMS.map(stemRe), BEAR_RE = BEAR_STEMS.map(stemRe);
function sentencesOf(text){
  return text.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(x=>x.length>10);
}
function score(txt){
  let up = 0, dn = 0;
  BULL_RE.forEach(r => { if (r.test(txt)) up++; });
  BEAR_RE.forEach(r => { if (r.test(txt)) dn++; });
  return { up, dn };
}
function stanceOf(sentence, wholePost){
  let { up, dn } = score(sentence);
  if (up === dn){ const w = score(wholePost); up += w.up; dn += w.dn; }   // 該句看不出方向就看整則
  if (up > dn) return "bull";
  if (dn > up) return "bear";
  return "neutral";
}
function localAnalyze(p){
  const sents = sentencesOf(p.text);
  const made = [];
  const used = new Set();
  for (const t of THEMES){
    for (const kw of t.kw){
      if (!kw || kw.length < 2) continue;
      const kre = new RegExp("\\b" + esc_re(kw) + (kw.length > 3 ? "\\w*" : "") + "\\b", "i");
      const hit = sents.find(sn => kre.test(sn));
      if (!hit) continue;
      if (used.has(t.name)) break;
      used.add(t.name);
      made.push({ id: safeKey(p.id + "-" + t.name), postId:p.id, ts:p.ts, link:p.link,
        person: p.person || "川普", note: p.note || "", outlet: p.outlet || "",
        target: t.name, targetEn: kw, kind:"", stance: stanceOf(hit, p.text),
        quote: hit.slice(0,280), zh:"", why:"", theme: t.name, related:[], local:true });
      break;
    }
  }
  return made;
}

/* ---------- AI 切割（格式不認得時的保底） ---------- */
async function aiSplit(text, signal){
  const p = `This is scraped text from an archive of Donald Trump's Truth Social posts. Split it into individual posts.

TEXT:
<<<
${text.slice(0, 20000)}
>>>

For each post:
- "id": the numeric status id if one appears near the post (from a /statuses/NNNNN link); otherwise "".
- "date": the post's timestamp in ISO 8601 if you can read one; otherwise "".
- "text": the post's own words, cleaned of navigation, share buttons, repeated links and site chrome. Keep video transcripts and image descriptions.

Ignore page headers, menus, footers and anything that is not a post. Today is ${new Date().toISOString().slice(0,10)}.

Return JSON only, no prose, no code fences:
{"posts":[{"id":"","date":"","text":""}]}`;
  const out = parseJSON(await callAI(p, signal));
  const arr = Array.isArray(out?.posts) ? out.posts : [];
  return arr.map((x, i) => {
    const t = String(x.text||"").trim();
    if (!t || t.length < 10) return null;
    const d = x.date ? new Date(x.date) : new Date(NaN);
    return { id: safeKey(x.id ? "ts" + x.id : "ai-" + (x.date||"") + "-" + t.slice(0,40)),
      link: x.id ? "https://www.trumpstruth.org/statuses/" + x.id : "",
      text: t.slice(0,4000), ts: isNaN(d) ? Date.now() - i*60000 : d.getTime() };
  }).filter(Boolean);
}

/* ---------- AI 判讀 ---------- */
function buildPrompt(text){
  return `You read one Truth Social post by Donald Trump (the text may be a video transcript or an image description) and pull out only the things he NAMES that a market watcher could act on.

POST:
<<<
${text.slice(0,4000)}
>>>

A "call" is a concrete named target: a company (Boeing, Nvidia), a commodity or material (magnets, rare earths, copper, potash, oil), an industry or technology (drones, shipbuilding, semiconductors, nuclear), a named product or programme, or a country/trade partner where he states a policy that moves goods or money.

NOT calls: attacks on media or individuals, election endorsements, poll numbers, legal complaints, self-praise, general patriotism, anything with no tradable consequence. A post with none of these returns an empty array — that is normal and common.

For each call give:
- "target": the thing he named, in Traditional Chinese, short (波音, 磁鐵, 無人機, 造船業).
- "targetEn": the same thing as he wrote it in English.
- "kind": one of 公司 / 原物料 / 產業 / 政策 / 國家.
- "stance": "bull" when what he said points to more demand, more spending, protection, subsidy, or a signed order for that target; "bear" when it points to tariffs on it, price pressure, substitution away from it, investigation or cancellation; "neutral" only when he named it with no direction at all.
- "quote": the exact sentence from the post containing the call, verbatim, max 40 words.
- "zh": that sentence in natural Traditional Chinese, Taiwan usage.
- "why": one short Traditional Chinese sentence on the mechanism — why this is 多 or 空 for that target.
- "related": up to 4 US tickers or sector names to watch (MP, BA, NVDA). [] if none. Do NOT put Taiwan stock codes here.
- "theme": the single best match copied exactly from this list, or "" when none fits. Never invent a name outside the list:
${THEMES.map(t=>t.name).join(" / ")}

Return JSON only, no prose, no code fences:
{"calls":[{"target":"","targetEn":"","kind":"","stance":"bull|bear|neutral","quote":"","zh":"","why":"","related":[],"theme":""}]}`;
}
function aiErrMsg(status, body, who){
  const b = String(body||"");
  if (/API key not valid|API_KEY_INVALID|invalid_api_key|Incorrect API key/i.test(b))
    return `${who} 說這把 key 無效。請確認後台 /config 的 key 是 Google AI Studio 申請的（aistudio.google.com → Get API key），不是 Firebase 專案設定裡那組 apiKey。`;
  if (status === 403) return `${who} 拒絕存取（403）。可能是 key 沒開啟 Generative Language API，或設了 referrer 限制擋掉這個網域。`;
  if (status === 429) return `${who} 額度用完或請求太密集（429），等一下再試，或把「抓最近」天數調小。`;
  if (/model.*not found|is not supported/i.test(b))
    return `${who} 找不到這個模型。到後台 /config 把 model 換成可用的，例如 gemini-2.5-flash。`;
  return `${who} ${status}：${b.slice(0,160)}`;
}
async function callAI(p, signal){
  if (AI.provider === "gemini"){
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(AI.model)}:generateContent?key=${encodeURIComponent(AI.key)}`;
    const res = await fetch(url, { method:"POST", signal, headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ contents:[{ role:"user", parts:[{ text:p }] }], generationConfig:{ temperature:0.2, responseMimeType:"application/json" } }) });
    if (!res.ok) throw new Error(aiErrMsg(res.status, await res.text(), "Gemini"));
    const j = await res.json();
    return j?.candidates?.[0]?.content?.parts?.map(x=>x.text||"").join("") || "";
  }
  const res = await fetch((AI.baseUrl||"https://api.openai.com/v1").replace(/\/$/,"") + "/chat/completions", { method:"POST", signal,
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + AI.key },
    body: JSON.stringify({ model:AI.model, temperature:0.2, response_format:{type:"json_object"}, messages:[{ role:"user", content:p }] }) });
  if (!res.ok) throw new Error(aiErrMsg(res.status, await res.text(), "AI API"));
  const j = await res.json();
  return j?.choices?.[0]?.message?.content || "";
}
function parseJSON(t){
  const s = String(t).replace(/```json|```/g,"").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  return JSON.parse(a >= 0 ? s.slice(a, b+1) : s);
}
async function analyzePost(p, signal){
  if (!AI.key) return localAnalyze(p);
  const out = parseJSON(await callAI(buildPrompt(p.text), signal));
  const arr = Array.isArray(out?.calls) ? out.calls : [];
  const made = [];
  arr.forEach((c, i) => {
    const target = String(c.target||"").trim(); if (!target) return;
    made.push({ id: safeKey(p.id + "-" + i), postId:p.id, ts:p.ts, link:p.link,
      person: p.person || "川普", note: p.note || "", outlet: p.outlet || "", target,
      targetEn:String(c.targetEn||"").trim(), kind:String(c.kind||"").trim(),
      stance:["bull","bear","neutral"].includes(c.stance)?c.stance:"neutral",
      quote:String(c.quote||"").trim(), zh:String(c.zh||"").trim(), why:String(c.why||"").trim(),
      theme:String(c.theme||"").trim(),
      related:Array.isArray(c.related)?c.related.map(x=>String(x).replace(/^\$/,"").trim()).filter(Boolean).slice(0,4):[] });
  });
  return made;
}

};

/* ---------- 共用：判讀一批貼文並寫入 ---------- */
async function ingest(list, signal, label){
  let done = 0, hits = 0, failed = 0;
  const prog = $("#prog"); prog.hidden = false; prog.max = list.length; prog.value = 0;
  for (const p of list){
    if (signal.aborted) break;
    setStatus(`判讀中 ${done+1} / ${list.length}…已挑出 ${hits} 個點名`);
    try{
      const made = await analyzePost(p, signal);
      for (const c of made){ CALLS[c.id] = c; hits++; await fbPut("calls/" + c.id, c).catch(()=>{}); }
      SEEN[p.id] = p.ts;
      await fbPut("seen/" + p.id, p.ts).catch(()=>{});
    }catch(e){ if (e.name === "AbortError") break; failed++; }
    done++; prog.value = done; cache(); render();
  }
  prog.hidden = true;
  LAST = new Date().toLocaleString("zh-TW"); cache();
  $("#lastRun").textContent = "上次更新 " + LAST;
  await fbPut("lastRun", LAST).catch(()=>{});
  setStatus(`${label}：看了 ${done} 則，挑出 ${hits} 個點名${failed?`，${failed} 則判讀失敗`:""}。` + (SRC_REPORT ? `（來源：${SRC_REPORT}）` : ""));
}

function fillPasteWho(){
  const sel = $("#pasteWho"); if (!sel) return;
  const names = [...new Set(SOURCES.map(x => x.person).concat(["川普"]))];
  sel.innerHTML = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
}
$("#pasteBtn").onclick = () => { const w = $("#pasteWrap"); w.hidden = !w.hidden; fillPasteWho(); if (!w.hidden) $("#pasteText").focus(); };
$("#pasteRun").onclick = async () => {
  const raw = $("#pasteText").value.trim();
  if (!raw){ setStatus("先貼上內容。", true); return; }
  const who = $("#pasteWho").value || "川普";
  let posts = parseLoose(raw);
  if (!posts.length && raw.includes("realDonaldTrump")) posts = parseByHandle(raw);
  if (!posts.length) posts = parseBySignoff(raw);
  if (!posts.length) posts = parseByParagraph(raw);
  posts = posts.map(p => ({ ...p, person: who, note: who === "川普" ? "本人發文" : "手動輸入" }));
  if (!posts.length){ setStatus("解析不出貼文，確認有複製到含時間戳的整頁內容。", true); return; }
  const cutoff = Date.now() - (+$("#days").value) * 86400000;
  const todo = posts.filter(p => (p.noDate || p.ts >= cutoff) && !SEEN[p.id]).slice(0, CONFIG.maxPosts);
  if (!todo.length){ setStatus(`讀到 ${posts.length} 則，但都在時間範圍外或已經判讀過。可以把天數拉大再試。`); return; }
  CTL = new AbortController();
  $("#pasteRun").disabled = true; $("#stop").hidden = false; $("#stop").onclick = () => CTL.abort();
  try{ await ingest(todo, CTL.signal, `貼上解析（讀到 ${posts.length} 則）`); $("#pasteText").value = ""; }
  catch(e){ setStatus(e.message, true); }
  finally{ $("#pasteRun").disabled = false; $("#stop").hidden = true; }
};

/* ---------- 顯示 ---------- */
let FILTER = "all";
$$("#filterSeg [data-f]").forEach(b => b.onclick = () => {
  FILTER = b.dataset.f; $$("#filterSeg [data-f]").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); render();
});
$("#q").oninput = () => render();
$("#who").onchange = () => render();
function srcLink(c){
  if (c.link) return { url:c.link, label: c.outlet || (c.link.includes("trumpstruth") ? "Truth Social 存檔" : "原始報導") };
  const q = (c.quote || "").replace(/[^\w\s]/g," ").split(/\s+/).filter(Boolean).slice(0,8).join(" ");
  if ((c.person || "川普") === "川普" && q)
    return { url: "https://www.trumpstruth.org/search?q=" + encodeURIComponent(q), label: "到存檔站找這句" };
  if (q) return { url: "https://www.google.com/search?q=" + encodeURIComponent(`"${q}"`), label: "Google 這句" };
  return null;
}
function twBlock(c){
  const t = matchTheme(c);
  if (!t) return `<div class="tw"><div class="lab">台股概念股　<span class="hint">對照表沒有這個主題，到後台 themes 新增一行就會出現</span></div></div>`;
  if (!t.stocks.length) return `<div class="tw"><div class="lab">台股概念股　<span class="th">${esc(t.name)}</span>　<span class="hint">這個主題還沒填股票</span></div></div>`;
  return `<div class="tw">
    <div class="lab">台股概念股　<span class="th">${esc(t.name)}</span>${c.stance!=="neutral"?`　<span class="tag ${c.stance}">${VERDICT[c.stance]}</span>`:""}</div>
    <div class="stocks">${t.stocks.map(s=>`<a class="st" href="https://tw.stock.yahoo.com/quote/${encodeURIComponent(s.code)}.TW" target="_blank" rel="noopener"><b>${esc(s.code)}</b>${esc(s.name)}</a>`).join("")}</div>
    <p class="note">依後台對照表帶出，進場前自己再查一次。</p>
  </div>`;
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const all = Object.values(CALLS).sort((a,b)=>b.ts-a.ts);
  const who = $("#who").value;
  const people = [...new Set(all.map(c => c.person || "川普"))];
  const cur = $("#who").value;
  $("#who").innerHTML = `<option value="">所有人</option>` + people.map(x=>`<option value="${esc(x)}"${x===cur?" selected":""}>${esc(x)}</option>`).join("");
  const rows = all.filter(c => {
    if (who && (c.person || "川普") !== who) return false;
    if (FILTER !== "all" && c.stance !== FILTER) return false;
    if (!q) return true;
    const t = matchTheme(c);
    return (c.target + " " + c.targetEn + " " + c.why + " " + c.zh + " " + (c.theme||"") + " " + (c.related||[]).join(" ")
      + " " + (t ? t.name + " " + t.stocks.map(x=>x.code + x.name).join(" ") : "")).toLowerCase().includes(q);
  });
  $("#count").textContent = `顯示 ${rows.length} / 共 ${all.length} 個點名`;

  const freq = {};
  all.forEach(c => freq[c.target] = (freq[c.target]||0)+1);
  const hot = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const week = all.filter(c => c.ts >= Date.now() - 7*86400000);
  $("#pulse").innerHTML = all.length ? `<div class="pulse">
    <div><div class="k">近 7 天點名</div><div class="v">${week.length}</div></div>
    <div><div class="k">多</div><div class="v" style="color:var(--up)">${all.filter(c=>c.stance==="bull").length}</div></div>
    <div><div class="k">空</div><div class="v" style="color:var(--down)">${all.filter(c=>c.stance==="bear").length}</div></div>
    <div style="flex:1;min-width:200px"><div class="k">最常被點到</div><div class="chips">${
      hot.map(([t,n])=>`<span class="tag neutral">${esc(t)} ×${n}</span>`).join("")}</div></div>
  </div>` : "";

  $("#list").innerHTML = rows.length ? rows.map(c => {
    const d = new Date(c.ts);
    const when = isNaN(d) ? "" : d.toLocaleString("zh-TW", { month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit" });
    return `<article class="call ${c.stance}">
      <div class="top">
        <span class="target">${esc(c.target)}</span>
        ${c.targetEn?`<span class="hint">${esc(c.targetEn)}</span>`:""}
        ${c.kind?`<span class="kind">${esc(c.kind)}</span>`:""}
        <span class="kind" style="border-color:var(--brand);color:var(--brand)">${esc(c.person || "川普")}${c.note?"・"+esc(c.note):""}</span>
        <span class="verdict ${c.stance}">${VERDICT[c.stance]}</span>
      </div>
      ${c.quote?`<p class="quote">${esc(c.quote)}</p>`:""}
      ${c.zh?`<p class="zh">${esc(c.zh)}</p>`:""}
      ${c.why?`<p class="why">${esc(c.why)}</p>`:""}
      ${c.local?`<p class="hint" style="margin:8px 0 0">關鍵詞比對結果，未經 AI 判讀</p>`:""}
      ${(c.related||[]).length?`<div class="rel"><span class="lab">美股相關</span>${c.related.map(r=>`<span class="tag ${c.stance}">${esc(r)}</span>`).join("")}</div>`:""}
      ${twBlock(c)}
      ${(() => { const L = srcLink(c); return `<div class="src">出處　${L
        ? `<a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.label)} ↗</a>`
        : `<span class="hint">沒有可連的出處</span>`}</div>`; })()}
      <div class="foot"><span>${esc(when)}</span>
        <span class="ops">${(() => { const L = srcLink(c); return L ? `<a class="btn small ghost" href="${esc(L.url)}" target="_blank" rel="noopener">開啟原文</a>` : ""; })()}
        <button class="btn small ghost" data-del="${esc(c.id)}" style="color:var(--up)">刪除</button></span></div>
    </article>`;
  }).join("") : `<div class="empty"><p>${all.length ? "這個篩選沒有東西。" : "還沒有資料，上面按「更新」。"}</p></div>`;
}
$("#list").addEventListener("click", async e => {
  const id = e.target.dataset.del; if (!id) return;
  if (!confirm("刪除這筆點名？")) return;
  delete CALLS[id]; cache(); render();
  if (fbOn()){ try{ await fetch(fbURL("calls/" + id), { method:"DELETE" }); }catch(err){} }
});

if (LAST) $("#lastRun").textContent = "上次更新 " + LAST;
boot();
})();
</script>
