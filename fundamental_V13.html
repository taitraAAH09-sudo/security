document.getElementById('docOut').innerHTML = `
<h3>這支工具在找什麼</h3>
<p>找「<b>法人正在買、基本面確實好、但股價還沒噴出去</b>」的股票。三個條件缺一不可——
只有法人買沒有基本面，可能是被動調整或短線；只有基本面好沒有法人買，可能還要等很久；
兩者都有但已經漲了兩成，那不叫卡位，叫追價。</p>

<div class="warn">
<b>「法人認為基本面很好」是推論，不是資料。</b>
看得到的只有「法人在買」這個事實，看不到他們為什麼買。法人買進的理由可能是基本面研究，
也可能是被動指數基金調整成分股、除權息前佈局、避險對沖，或純粹的程式交易。
這支工具做的是「基本面好」與「法人在買」與「還沒漲」三者的交集。
這個交集本身有意義，但別把它讀成法人替你做完了基本面研究。
</div>

<h3>為什麼投信權重比外資高</h3>
<p>投信（國內基金）多半主動選股、有自己的研究團隊、部位相對集中，季底還有作帳壓力傾向續抱。
外資買超裡有很大一塊是被動指數基金與套利部位，跟個股基本面沒什麼關係。
所以投信連買 12 分、外資連買 8 分，而且「投信連買天數」在篩選列上是獨立條件。</p>

<h3>三個分數</h3>
<table>
<tr><th>軸</th><th>滿分</th><th>項目</th></tr>
<tr><td><b>法人卡位</b></td><td>40</td><td>投信連買 12／外資連買 8／吸籌強度 12／外資投信同步 8</td></tr>
<tr><td><b>基本面</b></td><td>35</td><td>營收年增 12／營業利益率 9／單季 EPS 9／負債比 5／本益比 5</td></tr>
<tr><td><b>還有多少空間</b></td><td>25</td><td>買超期間漲幅 9／距 20 日高點 6／距 MA20 4／相對同業估值 6</td></tr>
</table>
<p><b>「空間」這一軸是刻意反向的。</b>買超期間漲幅越小分越高、離前高越遠分越高。
一般選股工具獎勵強勢股，這支獎勵還沒動的股票，因為主題是卡位不是追價。
漲幅超過 20% 直接給 0 分，篩選列預設也把上限設在 15%。</p>
<p>任何一項拿不到資料就標「無資料」，該項滿分從分母扣掉，其餘按比例還原成 100 分制。
缺資料不等於零分，但每檔都會顯示「資料完整度」，完整度低的分數要打折看。</p>
<div class="warn">
<b>整個基本面軸都沒資料時要特別小心。</b>那一欄會顯示「—」而不是 0，卡位分等於只由法人與空間兩軸算出來——
這種分數再高也沒有意義，因為這支工具的前提就是「基本面確實好」。
篩選列的「只看基本面有資料的」預設打勾，就是為了擋掉這種。
要看全部（例如想確認基本面端點是不是掛了）再把它取消。
</div>

<h3>市值、合理價、溢價是怎麼算的</h3>
<p>不自己拼財報歷史，改用交易所每天公布的本益比與股價淨值比反推：</p>
<ul>
<li><b>近四季 EPS</b>＝收盤價 ÷ 本益比。交易所的本益比本來就是用近四季累計每股盈餘算的，反推回去就得到 TTM EPS，比自己接四季財報可靠得多。</li>
<li><b>每股淨值</b>＝收盤價 ÷ 股價淨值比。</li>
<li><b>市值</b>＝收盤價 ×（實收資本額 ÷ 每股面額）。實收資本額取自公司基本資料端點，面額多數是 10 元。</li>
<li><b>合理價區間</b>＝近四季 EPS ×（同產業本益比的 P25 ～ P75）。中位數當合理價中值。</li>
<li><b>溢價%</b>＝（現價 − 合理價中值）÷ 合理價中值。正的是溢價、負的是折價。</li>
</ul>
<div class="warn">
<b>這個合理價是相對估值，不是絕對估值。</b>它回答的是「這檔相對同業貴還是便宜」，
不是「這家公司值多少錢」。三個要留意的地方：
<ul>
<li>同業本益比中位數本身會隨行情起伏。整個產業被炒高時，貴的股票也會顯示「合理」。</li>
<li>近四季 EPS 是回頭看的。景氣循環股在獲利高點時本益比最低，看起來最便宜，那往往是最貴的時候。</li>
<li>近四季合計虧損的公司算不出本益比，合理價會顯示「—」。這不是 bug。</li>
</ul>
同產業樣本少於 8 檔時退用全市場分位；本益比上緣封在 40 倍，免得高本益比產業算出離譜的目標價。
</div>

<div class="warn">
<b>合理價一定要有同產業樣本才算。</b>缺產業別、或同業不足 8 檔時，這欄直接顯示「—」，
點開該列會告訴你是哪個原因。
早期版本在缺產業別時會退回用「全市場」本益比分位，結果電子股的高本益比把水泥、營建這類
成熟股的目標價拉到它們從來沒到過的水準（亞泥被算出 100 元就是這樣來的）。
寧可不給數字，也不給一個錯的錨。本益比上緣另外封在 30 倍。
</div>

<div class="warn">
<b>這個合理價對「獲利拐點股」完全無效，工具現在會自己閉嘴。</b><br>
方法是「落後四季 EPS × 同業本益比中位數」，它預設市場給的倍數應該跟同業差不多。
但轉型股、題材股、獲利剛要放量的股票，市場給的是<b>未來</b>獲利的價格，跟過去四季無關。<br>
例：一詮（2486）現價約 235，落後四季 EPS 約 2 元，市場給到 117 倍本益比——
因為它從傳統 LED 導線架轉去做 AI 散熱。用同業 15 倍去乘，只會算出 30 元這種
「它 2021 年以前的舊股價」。數字看起來很精確，其實完全不適用。<br>
所以現在的規則是：<b>當市場給的本益比達到同業中位數 3 倍以上，合理價直接顯示「—」</b>，
並在明細寫出是幾倍、為什麼不算。清單上也會掛一個「市場給 N 倍同業本益比」的標籤。
不給數字，好過給一個看起來很篤定的錯數字。
</div>
<p>反過來說，這個標籤本身就是有用的資訊：對「卡位」這個主題而言，
市場已經給到同業好幾倍本益比的股票，<b>本來就不是卡位標的</b>，那是題材已經發動的股票。</p>

<h3>資料源被公司網路擋住怎麼辦</h3>
<p>實測發現 <code>openapi.twse.com.tw</code> 與 <code>www.tpex.org.tw</code> 在某些網路環境下
連直連都 Failed to fetch，而 <code>www.twse.com.tw</code>（法人與行情的來源）卻一直很順。
這比較像網路層封鎖，不是 CORS 問題——公司防火牆常放行主要財經網站、擋掉公用 proxy 網域。</p>
<p>對策是能搬的都搬到通的那個網域：</p>
<ul>
<li><b>本益比／股價淨值比</b>改走 <code>www.twse.com.tw/rwd/zh/afterTrading/BWIBBU_d</code>，
原本的 openapi 版留作備援。這支還多給「財報年/季」，順便補上財報期別。</li>
<li><b>產業別</b>改用 <code>MI_INDEX</code> 的分類代碼逐類查（水泥 01、半導體 24、電子零組件 28…），
同樣在通的網域上。產業歸屬很少變，一天抓一次就夠。沒有產業別就沒有合理價，這一條很關鍵。</li>
<li>月營收與財務報表目前只有 openapi 有，還沒有替代來源。這兩項如果一直抓不到，
最快的解法是把檔案放到 GitHub Pages 或用手機網路跑一次，資料進 Firebase 之後就不必再抓。</li>
</ul>

<h3>欄位太多看不完？</h3>
<p>表格上方有「⚙ 欄位顯示」，可以逐欄開關，選擇會記在瀏覽器裡。
<b>第一次打開預設就是「只留核心」20 欄</b>（代號、名稱、產業、卡位分、位階、投信籌碼、營收與三率、估值）；
按「全部顯示」把 35 欄攤開。代號、名稱、卡位分三欄鎖住不給關。</p>
<p>沒進核心的是量倍、期間漲幅、距20日高、距MA20、吸籌%、法人分、空間分、外資連買等。
這些不是沒用，是在你已經有「位階型態」這一欄之後資訊重複——型態標籤已經把「噴出了沒」講完了。
需要細看時再打開。</p>

<h3>溢價%：紅綠代表什麼</h3>
<p>是的，用 EPS 估的。路徑是：<b>收盤 ÷ 交易所本益比 = 近四季 EPS</b>，再乘上同產業本益比的中位數得到合理價中值，
現價偏離中值多少就是溢價。</p>
<p>顏色沿用台股慣例（紅漲綠跌），所以：</p>
<ul>
<li><b class="pos">紅色「貴 +N%」</b>＝現價高於同業合理價中值，<b>相對偏貴</b></li>
<li><b class="neg">綠色「便宜 −N%」</b>＝現價低於中值，<b>相對便宜</b></li>
</ul>
<div class="warn">
這裡的紅色<b>不是</b>「漲得好」的意思，是「貴了、要小心」。
台股習慣紅色代表正面，這一欄剛好相反，所以我在數字前面直接寫上「貴／便宜」兩個字，避免看反。
另外再提醒一次：這是<b>相對同業</b>的估值，不是絕對價值。整個產業被炒高時，貴的股票也會顯示「便宜」。
</div>

<h3>營收月份這一欄</h3>
<p>月營收每月 10 日前公告上個月的數字，所以這欄顯示的是<b>資料所屬月份</b>（不是公告日）。
旁邊的營收年增%是跟去年同月比、營收月增%是跟上個月比，兩欄都紅漲綠跌。
過了 8/10 之後這欄應該顯示 2026/07；如果還停在更早的月份，代表月營收端點沒抓到最新一期。</p>
<p>「財報日期」是另一回事——那是季報（毛利率、營益率、淨利率、三率三升的來源），一季才更新一次。
帶 <code>※</code> 表示抓不到出表日期、退回用最後交易日代替。</p>

<h3>要分享給同事：一人灌資料，其他人唯讀</h3>
<p>如果公司網路擋掉證交所，架構應該是<b>一個人在沒被擋的網路上灌滿雲端，其他人只讀雲端</b>。
這樣同事那台完全不需要連得上證交所。</p>

<p><b>你（灌資料的那個人）要做的：</b></p>
<ul>
<li>切到手機熱點，或任何沒被擋的網路</li>
<li>「資料源」分頁填 Firebase 網址、勾「啟用雲端快取」、按「測試連線」確認讀寫都通</li>
<li>按「更新並篩選」跑完整流程</li>
<li>再按「<b>把本機資料全部灌上雲端</b>」——它會把每個交易日、基本面快照、三率歷史一次全部推上去</li>
<li>之後每天在通的網路上跑一次就好，新的那天會自動同步</li>
</ul>

<p><b>同事要做的：</b></p>
<ul>
<li>填同一個 Firebase 網址</li>
<li>勾「啟用雲端快取」<b>和「只讀雲端（完全不連證交所）」</b></li>
<li>按「更新並篩選」——這時它只會跟 Firebase 要資料，一次都不會碰證交所</li>
</ul>

<div class="warn">
<b>兩個要先確認的事。</b><br>
一、<b>Firebase 本身會不會也被公司網路擋？</b>如果 <code>*.firebaseio.com</code> 也在黑名單裡，這條路一樣不通。
請同事先按「測試連線」，通了才有意義。<br>
二、<b>資料庫規則要允許讀取。</b>同事只需要讀，所以比較安全的設法是讀開放、寫限制：
<code>{"rules":{".read":true,".write":false}}</code>，等你要灌資料時再暫時把 <code>.write</code> 打開。
規則全開（讀寫都 true）方便但任何人拿到網址都能改你的資料，自己斟酌。
</div>

<p>唯讀模式下，基本面快照<b>不管多舊都會收下</b>——對連不到證交所的人來說，昨天的資料遠好過沒有資料。
頁面上方的「最後更新」與「月營收 / 財報」期別會告訴同事手上這份資料是什麼時候的。</p>

<h3>訊號：什麼時候上車、什麼時候下車</h3>
<div class="warn">
<b>合理價不是用來抓進出點的。</b>它回答「這檔值不值得我關注」，不回答「今天該不該買」。
你要的進出訊號在籌碼與位階，所以「訊號」這一欄<b>刻意完全不看估值</b>。
</div>
<p>判定順序由重到輕，先確認要不要離場，再談要不要進場：</p>
<table>
<tr><th>訊號</th><th>觸發條件</th><th>意思</th></tr>
<tr><td>投信轉賣</td><td>近 5 日投信淨賣超且今日沒買</td><td>進場理由已消失</td></tr>
<tr><td>跌破防守</td><td>收盤跌破 MA20／20 日低／頸線中最近的那道</td><td>進場理由不成立了</td></tr>
<tr><td>買盤中斷</td><td>投信最近兩個交易日都沒買</td><td>先前的連買段落可能結束</td></tr>
<tr><td>已發動</td><td>買超期間漲幅 ≥20%</td><td>這時候進場是追價不是卡位</td></tr>
<tr><td><b>可觀察</b></td><td>打底／剛突破／剛站回均線　＋　投信買多賣少　＋　期間漲幅 ≤10%　＋　外資沒對倒</td><td>四個條件同時成立</td></tr>
<tr><td>外資對倒</td><td>投信在買但外資近 5 日賣 ≥3 天且淨賣超</td><td>可能是投信在接盤</td></tr>
<tr><td>續抱</td><td>投信仍在買、站在支撐之上，但已漲一段</td><td>不宜再加碼</td></tr>
</table>
<p>點開任一列，「進場理由 / 理由消失在哪 / 籌碼還在不在 / 還有多少空間」四格會把該檔的數字攤開。
<b>防守位的用法是：跌破它代表你當初進場的那個理由不成立了</b>，不是虧損到某個百分比才停損。
進場理由是「剛站回 20 日線」，那跌破 20 日線就該走；理由是「突破頸線」，那跌回頸線下就該走。</p>

<h3>為什麼合理價的區間那麼寬</h3>
<p>區間是「同業本益比 P25～P75 × 近四季 EPS」。如果算出 300～584，代表<b>那個產業裡各家本益比本來就散得很開</b>——
上緣是下緣的近兩倍，同業自己都沒共識，「中位數」這個錨自然就弱。</p>
<p>所以表格只顯示<b>合理價中值</b>一個數字，完整區間放在點開後的明細裡。
中值旁邊出現「寬」字，表示同業本益比離散度超過 2.2 倍，這個中值參考性低，看看就好。</p>
<p>務實的用法：<b>把溢價% 當粗篩，不當進出依據。</b>大幅折價值得多看一眼，
大幅溢價提醒你別在這裡加碼——但決定買賣的是訊號欄，不是這裡。</p>

<h3>「投信建倉」那顆按鈕在做什麼</h3>
<p>一鍵套上這組條件，用來找投信剛開始吃貨、但股價還沒發動的標的：</p>
<ul>
<li>近 10 日投信買超 ≥3 天，且買超天數比賣超天數多 ≥2 天（<b>買多賣少</b>，不是只看連買，中間斷一天不會整段作廢）</li>
<li>買超期間漲幅 ≤8%</li>
<li>量能溫和放大：近 5 日均量是 20 日均量的 1.2～3 倍</li>
<li>位階限打底整理／剛突破頸線／剛站回均線</li>
<li>排除外資對倒：近 5 日外資賣超 ≥3 天且淨賣超</li>
<li>依「建倉%」由大到小排</li>
</ul>

<h3>位階型態怎麼判的</h3>
<table>
<tr><th>標籤</th><th>判定</th></tr>
<tr><td>已噴出</td><td>距 20 日線 &gt;10%，或 20 日漲幅 &gt;20%</td></tr>
<tr><td>剛突破頸線</td><td>站上「不含最近 3 日」的 20 日高點，且突破幅度 ≤5%</td></tr>
<tr><td>剛站回均線</td><td>五日內曾在 20 日線下方，今日收在其上</td></tr>
<tr><td>打底整理</td><td>20 日振幅（高−低）÷低 &lt;15%</td></tr>
<tr><td>回檔測均線</td><td>距 20 日線 −4%～+2%</td></tr>
</table>
<p>依你的要求，型態<b>只當標籤與可選篩選，不進評分</b>。順序是由上往下判，先中先算。</p>

<div class="warn">
<b>「建倉%」不是投信持股比率。</b>公開 API 只給每日買賣超（流量），不給持股水位（存量）。
這一欄是「近 20 日投信淨買超 ÷ 股本」，量的是<b>最近吃了多少貨</b>，不是<b>總共抱多少</b>。
一檔長期被投信抱著 8% 的股票，如果這個月沒動作，這欄會接近 0。
你原本要的 1～6% 持股比率，Yahoo 股市有公布，但那是 HTML 頁面不是 JSON，要另外爬。
</div>

<div class="warn">
<b>投信買超榜正在被 ETF 稀釋。</b>主動式 ETF 成立與高股息 ETF 募集造成的建倉，
在統計上都算「投信買超」，但那是被動配置不是經理人看好基本面。
金融股大量出現在買超榜多半就是這個原因（工具預設已排除金融股）。
看到投信大買時，先確認它不是剛好被納入某檔 ETF 成分。
</div>

<h3>參考防守位</h3>
<p>取現價下方最近的一道支撐（MA20／20 日低點／突破的頸線，三者取最高的那個），並算出距離幾 %。
這是<b>位置參考不是進出建議</b>。比較有意義的用法是：防守位設在你進場理由消失的地方——
如果進場理由是「剛站回 20 日線」，跌破 20 日線就是理由消失；理由是「突破頸線」，跌回頸線下就是。
這比抓一個固定百分比停損有依據。</p>

<h3>三率三升</h3>
<p>毛利率、營業利益率、稅後淨利率三者同時比上一期高。這需要<b>兩期</b>財報才算得出來，
而公開 API 只給最新一期，所以工具改成自己累積：每次抓到新的一季就把三率存進
<code>/kawei/hist/{期別}</code>，下一季自然就比得出來。全自動，不必手動輸入。</p>
<table>
<tr><th>顯示</th><th>意思</th></tr>
<tr><td>三率三升</td><td>三個都比上一期高，這是事實不是推測</td></tr>
<tr><td>N 升</td><td>只有部分上升，點開列可以看到三個各差幾個百分點</td></tr>
<tr><td>三率齊跌</td><td>三個都比上一期低</td></tr>
<tr><td>推測</td><td><b>手上只有一期財報，算不出實際變化</b>。改用營收年增與月增給方向判斷</td></tr>
<tr><td>待累積</td><td>只有一期，且連營收資料都沒有</td></tr>
</table>
<div class="warn">
<b>「推測」那一格不是預測，是代打。</b>它只是說「營收在放大，三率有機會跟著改善」。
營收成長不必然帶來毛利率上升——低價搶單、原料漲價、產品組合變差，都會讓營收漲而三率跌。
第一次跑一定全部是「推測」，等下一季財報出來（大約三個月後）才會變成實際的三率三升判斷。
在那之前請把這欄當成參考，不要當成結論。
</div>

<h3>財報日期這一欄</h3>
<p>顯示財報的<b>出表日期</b>，也就是交易所產生這份資料表的日子。
要留意這不等於各公司實際公告財報的時點——公開 API 沒有逐家的公告日。
抓不到出表日期時，照你的要求統一退回最後一個交易日，並在後面加一個 <code>※</code> 標記，
讓你一眼看得出那是代用日期而不是真的財報日。</p>

<h3>資料是幾月幾號的</h3>
<p>頁面最上方那條橫幅會列出每一層資料各自的時點，因為它們本來就不同步：</p>
<ul>
<li><b>法人與行情</b>：日頻，顯示最新交易日，收盤後才會有當天的。</li>
<li><b>月營收</b>：月頻，每月 10 日前公告上個月的。</li>
<li><b>財報</b>：季頻，顯示年度與季別。</li>
<li><b>最後更新</b>：你上次按「更新並篩選」的時間。沒按就不會變，所以不必反覆重抓。</li>
</ul>
<p>匯出的 CSV 檔名也會帶上資料日期，例如 <code>法人卡位_資料日20260818.csv</code>。</p>

<h3>Firebase 雲端快取</h3>
<p>在「資料源」分頁填 Realtime Database 網址並勾選啟用。之後每個交易日會存成一筆
<code>/kawei/days/{日期}</code>，基本面快照存 <code>/kawei/fund</code>。</p>
<ul>
<li>要抓某一天時<b>先問雲端</b>，雲端有就直接拿，沒有才去跟證交所要，拿到後順手上傳。</li>
<li>所以同一天全世界只會抓一次。換電腦、換瀏覽器、清了本機快取，都不必重抓。</li>
<li>非交易日會標記成 <code>holiday</code>，下次直接跳過，不會每次都白試一遍。</li>
<li>資料庫規則要允許讀寫。填完按「測試連線」，會實際寫一筆再讀回來比對，並告訴你雲端已經存了幾天。</li>
</ul>
<p>這也順帶解決公用 CORS 代理不穩的問題——代理只在「雲端沒有這天」時才會用到。</p>

<h3>幾個欄位的定義</h3>
<ul>
<li><b>吸籌強度</b>＝近 5 日（外資＋投信）買超張數 ÷ 近 5 日總成交張數。8% 以上代表法人吃掉了近期相當比例的量，籌碼在集中。</li>
<li><b>買超期間漲幅</b>＝從法人開始連買的前一日收盤，算到最新收盤。這是判斷卡位還是追價最直接的數字。</li>
<li><b>距 20 日高點</b>＝負值代表還在高點下方，越負離前高越遠、空間越大。</li>
<li><b>連買天數</b>＝從最新一天往回數連續買超的天數，中斷即停。</li>
</ul>

<h3>資料怎麼來（全自動，不需要輸入任何數字）</h3>
<ul>
<li><b>法人買賣超</b>：<code>www.twse.com.tw/rwd/zh/fund/T86</code>。這支接受 date 參數，可以一天一天往回抓。單位是股，程式已除以 1000 換成張。非交易日回錯誤 stat，程式會跳過。</li>
<li><b>行情</b>：<code>MI_INDEX</code>，同樣可指定日期，取全市場開高低收與成交股數，用來算均線、20 日高低點、量。</li>
<li><b>基本面</b>：<code>openapi.twse.com.tw</code> 的月營收、綜合損益表、資產負債表、本益比，加 TPEx 對應端點。這些只有最新一期快照，但卡位主題只需要「當期基本面好不好」，不需要歷史。</li>
</ul>
<p>第一次執行抓約 25 個交易日（在「資料源」可調到 70），大概一兩分鐘。
之後每天只補新的那一天。資料存在瀏覽器 localStorage（<code>${CACHE_KEY}</code>）。</p>

<h3>目前的限制</h3>
<ul>
<li>T86 與 MI_INDEX 只有<b>上市</b>。上櫃的法人與行情要另接 TPEx 端點，V2 還沒做，所以上櫃股票目前沒有法人分數、會被濾掉。這是下一步最該補的。</li>
<li>損益表只涵蓋「一般業」，金控／保險／證券／異業各有各的端點（反正預設排除金融股）。</li>
<li>MA60 需要 60 個交易日，預設只抓 25 天，所以「季線之下」這個標籤在天數不足時不會出現。要用就把回溯天數調到 65。</li>
<li>沒有券商分點資料，做不到「主力集中度」，那不是公開資料。</li>
<li>公用 CORS 代理時好時壞。某幾天一直抓不到就多按幾次「更新並篩選」，它只補缺的日子。</li>
<li>營收是月頻、財報是季頻，公告都有落後；法人與價格是日頻。<b>同一列數字的時點並不一致</b>，這是台股基本面選股的固有落差。</li>
</ul>
`;

/* ---------- 綁定 ---------- */
document.querySelectorAll('.tab').forEach(t => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById(t.dataset.p).classList.add('on');
  };
});
document.querySelectorAll('#tbl th').forEach(th => {
  th.onclick = () => {
    const k = th.dataset.k;
    if(SORT.k === k) SORT.dir *= -1;
    else { SORT.k = k; SORT.dir = (k==='code'||k==='name'||k==='ind') ? 1 : -1; }
    render();
  };
});
['fScore','fTrust','fRun','fYoY','fPrem','fInd','fQ','fTrustOnly','fHasFund',
 'fT10','fNetD','fVol','fPat','fNoDump','fSig'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', render);
  el.addEventListener('change', render);
});

/* 一鍵套用「投信剛開始建倉、股價還沒發動」那組條件 */
const SET = (id, v) => { const e = document.getElementById(id);
  if(e.type === 'checkbox') e.checked = v; else e.value = v; };
document.getElementById('btnPreset').onclick = () => {
  SET('fScore', 0);      // 分數不設限，這組條件本身就夠嚴
  SET('fTrust', 0);
  SET('fT10', 3);        // 近 10 日投信至少買超 3 天，排除 1-2 天試單
  SET('fNetD', 2);       // 買多賣少
  SET('fRun', 8);        // 買超期間漲幅 ≤8%，還沒發動
  SET('fVol', 'mild');   // 量溫和放大，不追爆量
  SET('fPat', '__early');// 打底 / 剛突破 / 剛站回均線
  SET('fNoDump', true);  // 排除外資對倒
  SET('fPrem', 20);
  SET('fTrustOnly', true);
  SET('fHasFund', true);
  SET('fSig', 'watch');
  SORT = {k:'build20', dir:-1};
  render();
};
document.getElementById('btnReset').onclick = () => {
  ['fT10','fNetD','fRun','fYoY','fPrem','fVol','fPat','fQ','fSig'].forEach(id => SET(id, ''));
  SET('fScore', 0); SET('fTrust', 0); SET('fNoDump', false); SET('fTrustOnly', false);
  render();
};
document.getElementById('btnFbTest').onclick = fbTest;
['fbUrl','fbOn','fbOnly'].forEach(id =>
  document.getElementById(id).addEventListener('change', () => { fbSave(); fbLoad(); renderVintage(); renderAlert(); }));
document.getElementById('btnFbPush').onclick = pushAllToCloud;
['fNoFin','fNoLoss'].forEach(id => document.getElementById(id).addEventListener('change', score));
document.getElementById('btnRun').onclick = runAll;
document.getElementById('btnFund').onclick = runFundOnly;
document.getElementById('btnProbe').onclick = probeAll;
document.getElementById('btnCsv').onclick = exportCsv;
document.getElementById('btnClear').onclick = () => {
  if(!confirm('清空本機快取？下次執行會重新抓一次。')) return;
  try{ localStorage.removeItem(CACHE_KEY); }catch(e){}
  DATA = {dates:[], px:{}, ins:{}, fund:{}, fundAt:0};
  ROWS = []; render(); cacheInfo();
};

document.getElementById('btnCols').onclick = () =>
  document.getElementById('colPanel').classList.toggle('on');
document.getElementById('btnColsCore').onclick = () => colSet(COL_CORE);
document.getElementById('btnColsAll').onclick = () => { COL_HIDDEN = new Set(); colApply(); colPanel(); };

cacheLoad();
fbLoad();
colInit();
cacheInfo();
renderProbe();
renderVintage();
if(DATA.dates.length) score();
</script>
</body>
</html>
