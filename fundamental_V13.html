<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>法人卡位選股台 V13</title>
<style>
:root{
  --bg:#0d1117; --panel:#151b24; --panel2:#1b222d; --line:#28313f;
  --tx:#e6edf3; --dim:#8b98a8; --dim2:#5f6c7d;
  --up:#ff5b5b; --dn:#2ecc71; --accent:#f0b429; --blue:#58a6ff; --trust:#c792ea;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:1600px;margin:0 auto;padding:12px}

header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 12px;
  background:linear-gradient(180deg,#1a2230,#141a24);border:1px solid var(--line);border-radius:10px}
header h1{margin:0;font-size:17px;font-weight:700;letter-spacing:.5px}
.ver{font-size:11px;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:1px 6px;font-weight:700}
.hspace{flex:1}
.btn{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:7px;
  padding:7px 14px;font-size:13px;font-weight:600;transition:.15s}
.btn:hover{background:#243040;border-color:#3d4b5f}
.btn.pri{background:var(--accent);color:#1a1206;border-color:var(--accent)}
.btn.pri:hover{background:#ffc94a}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tabbar{display:flex;gap:6px;margin:12px 0 10px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:7px 16px;font-size:13px;font-weight:600}
.tab.on{background:var(--panel2);color:var(--tx);border-color:#3d4b5f}
.pane{display:none}.pane.on{display:block}

#status{margin:8px 0;padding:9px 12px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;font-size:12.5px;color:var(--dim);min-height:36px;display:flex;align-items:center;gap:8px}
#status.err{color:#ff9d9d;border-color:#5c2b2b}
.spin{width:12px;height:12px;border:2px solid var(--dim2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.prog{height:3px;background:#0f151d;border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}

.filters{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.frow{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--dim);font-weight:600}
.fld input,.fld select{background:#0f151d;color:var(--tx);border:1px solid var(--line);
  border-radius:6px;padding:6px 9px;font-size:13px;font-family:inherit}
.fld input[type=number]{width:80px}
.fld input[type=text]{width:140px}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer;padding-bottom:6px}
.chk input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}

.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--panel2);color:var(--dim);font-weight:600;text-align:right;padding:9px 8px;
  white-space:nowrap;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;border-bottom:1px solid var(--line)}
th:hover{color:var(--tx)} th.sorted{color:var(--accent)}
th:first-child,th:nth-child(2),th:nth-child(3){text-align:left}
td{padding:8px;border-bottom:1px solid #1e2733;text-align:right;white-space:nowrap}
td:first-child,td:nth-child(2),td:nth-child(3){text-align:left}
tbody tr{cursor:pointer} tbody tr:hover{background:#1a222e} tbody tr.sel{background:#1e2a3a}
.pos{color:var(--up)} .neg{color:var(--dn)} .na{color:var(--dim2)}
.code{font-family:ui-monospace,Menlo,monospace;color:var(--dim)}
.mk{font-size:10.5px;color:var(--dim2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.sc{font-weight:800;font-size:14px}
.sc.s1{color:var(--accent)} .sc.s2{color:var(--tx)} .sc.s3{color:var(--dim)}
.dots{display:inline-flex;gap:2px;vertical-align:middle}
.dots i{width:5px;height:12px;border-radius:1px;background:#2a323d;display:block}
.dots i.f{background:var(--trust)} .dots i.g{background:var(--blue)}

.detail{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.detail h3{margin:0 0 4px;font-size:16px}
.dsub{color:var(--dim);font-size:12px;margin-bottom:12px}
.axes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin-bottom:12px}
.ax{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.axh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-bottom:6px}
.axh b{color:var(--accent)}
.parts{display:flex;flex-direction:column;gap:5px}
.part{font-size:11.5px}
.pt1{display:flex;justify-content:space-between;color:var(--dim)}
.pt1 em{font-style:normal;color:var(--tx)}
.bar{height:3px;background:#0f151d;border-radius:2px;overflow:hidden;margin-top:2px}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.miss i{background:var(--dim2)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.tg{font-size:11px;font-weight:600;border-radius:4px;padding:2px 7px;background:#243040;color:var(--tx);border:1px solid var(--line)}
.tg.good{background:#3a1f24;color:#ffb3b3;border-color:#5c2b32}
.tg.bad{background:#12301f;color:#8fe0ad;border-color:#1f4a30}
.tg.tr{background:#2b2140;color:#d8b9ff;border-color:#43336b}
.spark{display:block;margin-top:8px}

.ep{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-bottom:9px}
.ep h4{margin:0 0 3px;font-size:13.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;border-radius:4px;padding:1px 7px}
.pill.ok{background:#12301f;color:#8fe0ad} .pill.bad{background:#3a1f24;color:#ffb3b3}
.pill.wait{background:#2a323d;color:var(--dim)} .pill.px{background:#2f2712;color:#ffd166}
.epurl{font-family:ui-monospace,monospace;font-size:11px;color:var(--dim2);word-break:break-all;margin-bottom:6px}
.kv{display:grid;grid-template-columns:minmax(130px,auto) 1fr;gap:2px 12px;font-size:11.5px;
  max-height:240px;overflow:auto;background:#0f151d;border-radius:6px;padding:8px;margin-top:6px}
.kv b{color:var(--blue);font-weight:600;word-break:break-all}
.kv span{color:var(--dim);word-break:break-all}

.doc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-size:13px;line-height:1.75}
.doc h3{margin:18px 0 6px;font-size:14.5px;color:var(--accent)} .doc h3:first-child{margin-top:0}
.doc ul{margin:4px 0;padding-left:20px}
.doc code{background:#0f151d;padding:1px 5px;border-radius:4px;font-size:11.5px;color:var(--blue)}
.doc table{font-size:12px;margin:6px 0}
.doc td,.doc th{text-align:left;padding:5px 8px;position:static;background:transparent;cursor:default}
.warn{border-left:3px solid var(--accent);background:#1e1a10;padding:9px 12px;border-radius:0 6px 6px 0;margin:8px 0}

.alertbox{margin:10px 0 0;padding:11px 14px;border-radius:9px;font-size:13px;
  background:#2a1518;border:1px solid #5c2b32;color:#ffc9c9;line-height:1.6}
.alertbox:empty{display:none}
.alertbox b{color:#fff}
.alertbox ul{margin:6px 0 0;padding-left:20px}
.alertbox li{font-size:12px;color:#e8b4b4}
.alertbox code{background:#1a0e10;padding:1px 5px;border-radius:4px;font-size:11px}
.alertbox+.alertbox{margin-top:8px}
.alertbox.soft{background:#1e1a10;border-color:#4a3c17;color:#ffd9a0}
.alertbox.soft b{color:var(--accent)}

.vint{display:flex;flex-wrap:wrap;gap:0;margin:0 0 10px;background:var(--panel);
  border:1px solid var(--line);border-radius:9px;overflow:hidden}
.vint:empty{display:none}
.vi{flex:1;min-width:150px;padding:8px 12px;border-right:1px solid var(--line)}
.vi:last-child{border-right:none}
.vi .k{font-size:10.5px;color:var(--dim2);letter-spacing:.4px}
.vi .v{font-size:14px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.vi .s{font-size:10.5px;color:var(--dim)}
.vi.warnv .v{color:var(--accent)}
.colbar{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.colpanel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  padding:12px;margin-bottom:10px}
.colpanel.on{display:block}
.colgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 14px}
.colgrid label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);cursor:pointer}
.colgrid label input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer;flex:none}
.colgrid label.locked{opacity:.45;cursor:not-allowed}
.colgrp{font-size:11px;color:var(--accent);font-weight:700;margin:10px 0 4px;letter-spacing:.5px}
.colgrp:first-child{margin-top:0}

.sigbox{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:12px}
.sigh{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--dim);flex-wrap:wrap}
.siggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.siggrid .k{font-size:10.5px;color:var(--dim2);letter-spacing:.4px}
.siggrid .v{font-size:14px;font-weight:700;color:var(--tx);font-variant-numeric:tabular-nums}
.siggrid .s{font-size:10.5px;color:var(--dim);line-height:1.5}

.sig{font-size:11px;font-weight:800;border-radius:4px;padding:2px 7px;white-space:nowrap;border:1px solid}
.sig.sw{background:#3a1f24;color:#ffb3b3;border-color:#7a3a44}
.sig.sh{background:#2f2712;color:#ffd166;border-color:#4a3c17}
.sig.sn{background:#1e2733;color:#a9b6c6;border-color:#3d4b5f}
.sig.sl{background:#2b2140;color:#d8b9ff;border-color:#43336b}
.sig.se{background:#12301f;color:#8fe0ad;border-color:#1f4a30}
.sig.so{background:#1a1f27;color:var(--dim2);border-color:var(--line)}

.fairbox{font-variant-numeric:tabular-nums}
.pat{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap;border:1px solid}
.pat.pb{background:#12222f;color:#7cc7ff;border-color:#1e3d55}
.pat.pk{background:#2b2140;color:#d8b9ff;border-color:#43336b}
.pat.pm{background:#1e2733;color:#a9b6c6;border-color:#33404f}
.pat.px{background:#3a1f24;color:#ffb3b3;border-color:#5c2b32}
.pat.pd{background:#12301f;color:#8fe0ad;border-color:#1f4a30}
.pat.pn{background:#1a1f27;color:var(--dim2);border-color:var(--line)}
.tri{font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap}
.tri.t3{background:#3a1f24;color:#ffb3b3;border:1px solid #5c2b32}
.tri.t2{background:#2f2712;color:#ffd166;border:1px solid #4a3c17}
.tri.t0{background:#12301f;color:#8fe0ad;border:1px solid #1f4a30}
.tri.tg{background:#1e2733;color:var(--dim);border:1px dashed #3d4b5f}
.tri.tw{background:#1a1f27;color:var(--dim2);border:1px solid var(--line)}
.prem{font-weight:700}
.fbrow{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line)}
.fbrow input[type=text]{width:340px}
@media(max-width:760px){ .vi{min-width:120px} .fbrow input[type=text]{width:100%} }

@media(max-width:760px){
  .wrap{padding:8px} header h1{font-size:15px}
  table{font-size:11.5px} th,td{padding:6px 5px}
  .fld input[type=text]{width:110px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>法人卡位選股台</h1><span class="ver" id="vtag">V13</span>
  <div class="hspace"></div>
  <button class="btn pri" id="btnRun">更新並篩選</button>
  <button class="btn" id="btnFund">只抓基本面</button>
  <button class="btn" id="btnCsv">匯出 CSV</button>
</header>

<div id="alert"></div>

<div class="tabbar">
  <button class="tab on" data-p="p1">🎯 卡位名單</button>
  <button class="tab" data-p="p2">🔬 資料源</button>
  <button class="tab" data-p="p3">📖 選股邏輯</button>
</div>

<div id="status">按右上「更新並篩選」開始。第一次會抓約 25 個交易日的法人與行情，大概一兩分鐘；之後只補新的日子。</div>

<div id="vintage" class="vint"></div>

<div class="pane on" id="p1">
  <div class="filters"><div class="frow">
    <div class="fld"><label>最低總分</label><input type="number" id="fScore" value="55" min="0" max="100"></div>
    <div class="fld"><label>投信連買 ≥ 日</label><input type="number" id="fTrust" value="0" min="0"></div>
    <div class="fld"><label>買超期間漲幅 ≤ %</label><input type="number" id="fRun" value="15"></div>
    <div class="fld"><label>營收年增 ≥ %</label><input type="number" id="fYoY" value=""></div>
    <div class="fld"><label>溢價 ≤ %</label><input type="number" id="fPrem" value=""></div>
    <div class="fld"><label>訊號</label><select id="fSig"><option value="">全部</option>
      <option value="watch">可觀察（上車候選）</option><option value="hold">續抱</option>
      <option value="warn">警戒</option><option value="late">已發動</option>
      <option value="exit">離場</option></select></div>
    <div class="fld"><label>產業</label><select id="fInd"><option value="">全部</option></select></div>
    <div class="fld"><label>搜尋</label><input type="text" id="fQ" placeholder="2330 或 台積電"></div>
    <label class="chk"><input type="checkbox" id="fNoFin" checked>排除金融股</label>
    <label class="chk"><input type="checkbox" id="fNoLoss" checked>排除虧損</label>
    <label class="chk"><input type="checkbox" id="fTrustOnly">只看投信有買的</label>
    <label class="chk"><input type="checkbox" id="fHasFund" checked>只看基本面有資料的</label>
  </div>
  <div class="frow" style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
    <button class="btn pri" id="btnPreset">套用「投信建倉」條件</button>
    <button class="btn" id="btnReset">清掉條件</button>
    <div class="fld"><label>投信 10 日買超天數 ≥</label><input type="number" id="fT10" value="" min="0" max="10"></div>
    <div class="fld"><label>買多賣少（買−賣天數）≥</label><input type="number" id="fNetD" value=""></div>
    <div class="fld"><label>量能倍數</label>
      <select id="fVol"><option value="">不限</option>
        <option value="mild">溫和放大 1.2～3 倍</option>
        <option value="nospike">排除爆量（單日 &gt;5 倍）</option></select></div>
    <div class="fld"><label>位階型態</label><select id="fPat"><option value="">全部</option>
      <option value="打底整理">打底整理</option><option value="剛突破頸線">剛突破頸線</option>
      <option value="剛站回均線">剛站回均線</option><option value="回檔測均線">回檔測均線</option>
      <option value="__early">前三種（尚未發動）</option>
      <option value="已噴出">已噴出</option></select></div>
    <label class="chk"><input type="checkbox" id="fNoDump">排除外資對倒（5 日賣 ≥3 天且淨賣）</label>
  </div></div>

  <div class="colbar">
    <button class="btn" id="btnCols">⚙ 欄位顯示</button>
    <span id="colCount" style="font-size:12px;color:var(--dim)"></span>
    <button class="btn" id="btnColsCore" style="font-size:12px;padding:5px 10px">只留核心</button>
    <button class="btn" id="btnColsAll" style="font-size:12px;padding:5px 10px">全部顯示</button>
  </div>
  <div class="colpanel" id="colPanel"></div>

  <div class="tblwrap"><table id="tbl">
    <thead><tr>
      <th data-k="code">代號</th><th data-k="name">名稱</th><th data-k="ind">產業</th>
      <th data-k="score">卡位分</th><th data-k="sigRank">訊號</th>
      <th data-k="sChip">法人</th><th data-k="sFund">基本面</th><th data-k="sRoom">空間</th>
      <th data-k="pattern">位階型態</th>
      <th data-k="trustD">投信連買</th><th data-k="t10buy">投信10日買/賣</th>
      <th data-k="foreignD">外資連買</th>
      <th data-k="net5">近5日買超(張)</th><th data-k="net20t">投信20日(張)</th>
      <th data-k="build20">建倉%</th><th data-k="absorb">吸籌%</th><th data-k="volRatio">量倍</th>
      <th data-k="runPct">期間漲幅%</th><th data-k="toHigh">距20日高%</th><th data-k="distMA20">距MA20%</th>
      <th data-k="revPeriod">營收月份</th><th data-k="revYoY">營收年增%</th><th data-k="revMoM">營收月增%</th>
      <th data-k="gm">毛利率%</th><th data-k="om">營益率%</th><th data-k="nm">淨利率%</th>
      <th data-k="triScore">三率三升</th><th data-k="repDate">財報日期</th><th data-k="epsTTM">EPS(近4季)</th>
      <th data-k="px">收盤</th><th data-k="supPx">參考防守位</th><th data-k="supGap">距防守%</th>
      <th data-k="mcap">市值(億)</th><th data-k="pe">本益比</th>
      <th data-k="fair">合理價中值</th><th data-k="prem">溢價%</th>
    </tr></thead>
    <tbody id="tb"></tbody>
  </table></div>
  <div id="detail"></div>
</div>

<div class="pane" id="p2">
  <div class="filters"><div class="frow">
    <div class="fld"><label>回溯交易日數</label><input type="number" id="fDays" value="25" min="10" max="70"></div>
    <button class="btn pri" id="btnProbe">探測所有端點</button>
    <button class="btn" id="btnClear">清空本機快取</button>
    <div style="color:var(--dim);font-size:12px;padding-bottom:6px;max-width:500px">
      逐支端點呼叫一次，顯示能不能直連（CORS）、回傳幾筆、第一筆的真實欄位名稱。欄位對不上時把這裡的 key 回報給我。
    </div>
  </div>
  <div class="fbrow">
    <div class="fld" style="flex:1">
      <label>Firebase Realtime Database 網址（抓過的日子存這裡，換裝置不必重抓）</label>
      <input type="text" id="fbUrl" placeholder="https://xxxx-default-rtdb.firebaseio.com">
    </div>
    <label class="chk"><input type="checkbox" id="fbOn">啟用雲端快取</label>
    <label class="chk"><input type="checkbox" id="fbOnly">只讀雲端（完全不連證交所）</label>
    <button class="btn" id="btnFbTest">測試連線</button>
    <button class="btn pri" id="btnFbPush">把本機資料全部灌上雲端</button>
    <div id="fbState" style="font-size:12px;color:var(--dim);padding-bottom:6px"></div>
  </div></div>
  <div id="cacheInfo" style="font-size:12px;color:var(--dim);margin-bottom:10px"></div>
  <div id="probeOut"></div>
</div>

<div class="pane" id="p3"><div class="doc" id="docOut"></div></div>

</div>

<script>
/* ==========================================================================
   法人卡位選股台 V13
   主題：找「法人正在買、基本面確實好、但股價還沒噴出去」的股票。
   資料全自動抓，不需要手動輸入任何數字。
   ========================================================================== */
/* 版號只在這裡改一次，標題與右上角徽章都從這裡推出去。
   每交付一版就 +1。 */
const VER = 'V13';

/* CORS 代理。實測發現：
   - openapi.twse.com.tw 沒開 CORS，全部得靠代理
   - allorigins 連得上但大檔會 HTTP 408 逾時
   - corsproxy.io 免費方案只允許 localhost / github.io 這類來源，
     直接用 file:// 開檔會被拒（Failed to fetch），且單檔上限 1MB
   所以多備幾家，並把能吃大檔的排前面。 */
const PROXY = [
  u => u,
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.cors.lol/?url=' + encodeURIComponent(u),
  u => 'https://proxy.corsfix.com/?' + u,
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u),
  u => 'https://whateverorigin.org/get?url=' + encodeURIComponent(u),
  u => 'https://corsproxy.io/?' + encodeURIComponent(u),
  u => 'https://thingproxy.freeboard.io/fetch/' + u
];
const PROXY_NAME = ['直連','allorigins','cors.lol','corsfix','corsproxy(url=)',
                    'codetabs','whateverorigin','corsproxy(舊格式)','thingproxy'];
async function getJSON(url){
  const notes = [];
  for(let i=0;i<PROXY.length;i++){
    const label = i===0 ? '直連' : PROXY_NAME[i];
    try{
      const r = await fetch(PROXY[i](url), {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const txt = await r.text();
      if(!txt) throw new Error('回傳空白');
      let data;
      try{ data = JSON.parse(txt); }
      catch(pe){ throw new Error('不是 JSON（前 60 字：' + txt.slice(0,60).replace(/\s+/g,' ') + '）'); }
      // whateverorigin 之類的代理會把內容包在 {contents:"..."} 裡，拆開來
      if(data && !Array.isArray(data) && typeof data.contents === 'string'){
        try{ data = JSON.parse(data.contents); }catch(e2){}
      }
      return {data, via: i===0 ? 'direct' : 'proxy'+i, viaName: label, bytes: txt.length};
    }catch(e){ notes.push(`${label}→${e.message}`); }
  }
  throw new Error(notes.join('；'));
}

function K(row, ...pats){
  if(!row) return undefined;
  const keys = Object.keys(row);
  for(const p of pats){
    const hit = keys.find(k => k.replace(/[\s\u3000]/g,'').indexOf(p) >= 0);
    if(hit !== undefined) return row[hit];
  }
  return undefined;
}
function N(v){
  if(v === null || v === undefined) return null;
  const s = String(v).replace(/[,\s\u3000%]/g,'').replace(/[\u2013\u2014\uFF0D]/g,'');
  if(s === '' || s === '-' || s === '--' || s === 'N/A') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function rowCode(row){
  const v = K(row,'公司代號','證券代號','SecuritiesCompanyCode','CompanyCode','Code');
  return v === undefined ? '' : String(v).trim();
}
function idxOf(fields, ...pats){
  for(const p of pats){
    const i = fields.findIndex(f => String(f).replace(/[\s\u3000]/g,'').indexOf(p) >= 0);
    if(i >= 0) return i;
  }
  return -1;
}
function pct(a,b){ return (a===null||b===null||!b) ? null : a/b*100; }
function fmt(v,d){ return (v===null||v===undefined||!isFinite(v)) ? '—' : Number(v).toFixed(d===undefined?2:d); }
function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0'); }

const FIN_WHITE = new Set(['5871']);
function isFinancial(code, name, ind){
  if(FIN_WHITE.has(code)) return false;
  const t = (name||'') + (ind||'');
  if(/金控|銀行|保險|證券|人壽|產險|票券|金融/.test(t)) return true;
  const n = +code;
  return (n>=2801 && n<=2899) || (n>=5820 && n<=5899);
}

/* ==========================================================================
   Firebase 雲端快取
   每個交易日各存一筆 /kawei/days/{YYYYMMDD}，抓過就不再跟證交所要。
   基本面快照存 /kawei/fund。規則需允許讀寫。
   ========================================================================== */
const FB_KEY = 'kawei_fb_v3';
let FB = {url:'', on:false, only:false};
function fbLoad(){
  try{ const o = JSON.parse(localStorage.getItem(FB_KEY)); if(o) FB = Object.assign(FB, o); }catch(e){}
  const u = document.getElementById('fbUrl'), c = document.getElementById('fbOn'),
        o2 = document.getElementById('fbOnly');
  if(u) u.value = FB.url || '';
  if(c) c.checked = !!FB.on;
  if(o2) o2.checked = !!FB.only;
}
function fbSave(){
  FB.url  = (document.getElementById('fbUrl').value || '').trim().replace(/\/+$/,'');
  FB.on   = document.getElementById('fbOn').checked;
  FB.only = document.getElementById('fbOnly').checked;
  if(FB.only) FB.on = true;                     // 唯讀模式必然要用雲端
  try{ localStorage.setItem(FB_KEY, JSON.stringify(FB)); }catch(e){}
}
function fbReady(){ return FB.on && /^https:\/\/.+/.test(FB.url); }
function fbOnlyMode(){ return FB.only && fbReady(); }
async function fbGet(path){
  if(!fbReady()) return null;
  // path 可能帶查詢字串（例如 kawei/days?shallow=true），
  // .json 必須接在路徑後面、查詢字串前面，否則 Firebase 認不得
  const i = path.indexOf('?');
  const p = i < 0 ? path : path.slice(0, i);
  const q = i < 0 ? ''   : '?' + path.slice(i+1);
  const r = await fetch(`${FB.url}/${p}.json${q}`, {cache:'no-store'});
  if(!r.ok) throw new Error('Firebase HTTP ' + r.status);
  return await r.json();
}
async function fbPut(path, body){
  if(!fbReady()) return false;
  const r = await fetch(`${FB.url}/${path}.json`, {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
  if(!r.ok) throw new Error('Firebase HTTP ' + r.status);
  return true;
}
async function fbTest(){
  const el = document.getElementById('fbState');
  fbSave();
  if(!/^https:\/\/.+/.test(FB.url)){ el.innerHTML = '<span style="color:#ff9d9d">網址格式不對，要像 https://專案-default-rtdb.firebaseio.com</span>'; return; }
  el.textContent = '測試中…';
  try{
    const stamp = Date.now();
    const saved = FB.on; FB.on = true;
    await fbPut('kawei/_ping', stamp);
    const back = await fbGet('kawei/_ping');
    const idx = await fbGet('kawei/days');
    FB.on = saved;
    const n = idx ? Object.keys(idx).length : 0;
    el.innerHTML = (back === stamp)
      ? `<span style="color:#8fe0ad">讀寫都通</span>，雲端已存 <b style="color:var(--tx)">${n}</b> 個交易日。`
      : '<span style="color:#ff9d9d">寫得進去但讀回來不一致</span>';
  }catch(e){
    el.innerHTML = `<span style="color:#ff9d9d">${e.message}</span>　（多半是資料庫規則沒開放讀寫）`;
  }
}

/* 只讀雲端：完全不碰證交所。
   給網路擋掉 TWSE 的人用——由另一個人在通的網路上灌滿雲端，這裡純粹下載。 */
async function loadFromCloud(fails){
  let days = 0;
  setStatus('讀取雲端索引…', true, false, 5);
  let index = null;
  try{ index = await fbGet('kawei/days?shallow=true'); }
  catch(e){ fails.push(`Firebase 索引：${e.message}`); }
  if(!index){
    // shallow 不支援時退而求其次，整包拉下來
    try{ index = await fbGet('kawei/days'); }catch(e){ fails.push(`Firebase 讀 days：${e.message}`); }
  }
  if(!index){ return {days:0, fund:0}; }

  const all = Object.keys(index).sort();
  const have = new Set(DATA.dates);
  const want = all.slice(-Math.max(+document.getElementById('fDays').value || 25, 25));
  const need = want.filter(d => !have.has(d));

  for(let i=0;i<need.length;i++){
    const d = need[i];
    setStatus(`從雲端讀 ${d}（${i+1}/${need.length}）`, true, false, 5 + Math.round(i/Math.max(need.length,1)*70));
    try{
      const day = await fbGet('kawei/days/' + d);
      if(day && day.ins && day.px){ pushDay(d, day.ins, day.px); days++; }
    }catch(e){ fails.push(`Firebase 讀 ${d}：${e.message}`); }
  }

  setStatus('讀取雲端基本面快照…', true, false, 80);
  let fund = 0;
  try{
    const snap = await fbGet('kawei/fund');
    // 唯讀模式不管快照多舊都收，因為這裡本來就沒有重抓的能力
    if(snap && snap.data){
      for(const c in snap.data){
        const src = snap.data[c], dst = fRec(c);
        ['name','ind','mkt','rev','is','bs','val','co'].forEach(k => { if(src[k]) dst[k] = src[k]; });
        fund++;
      }
      DATA.fundAt = snap.at || Date.now();
    }
  }catch(e){ fails.push(`Firebase 讀基本面：${e.message}`); }

  setStatus('讀取雲端三率歷史…', true, false, 90);
  try{
    const hist = await fbGet('kawei/hist');
    if(hist){ DATA.hist = DATA.hist || {}; for(const p in hist) DATA.hist[p] = Object.assign({}, hist[p], DATA.hist[p]||{}); }
  }catch(e){ fails.push(`Firebase 讀三率歷史：${e.message}`); }

  return {days, fund, cloudDays: all.length};
}

/* 把本機已有的東西一次全部灌上雲端。
   給「在通的網路上跑一次」的那個人用，跑完同事就有得讀了。 */
async function pushAllToCloud(){
  const btn = document.getElementById('btnFbPush');
  const el  = document.getElementById('fbState');
  fbSave();
  if(!fbReady()){ el.innerHTML = '<span style="color:#ff9d9d">請先填網址並勾選啟用雲端快取</span>'; return; }
  if(!DATA.dates.length){ el.innerHTML = '<span style="color:#ff9d9d">本機還沒有資料可以上傳，先按「更新並篩選」</span>'; return; }
  btn.disabled = true;
  let ok = 0, bad = 0;

  for(let i=0;i<DATA.dates.length;i++){
    const d = DATA.dates[i];
    setStatus(`上傳 ${d} 到雲端（${i+1}/${DATA.dates.length}）`, true, false, Math.round(i/DATA.dates.length*85));
    const ins = {}, px = {};
    for(const c in DATA.ins){
      const s = DATA.ins[c];
      if(s.f[i] !== null || s.t[i] !== null) ins[c] = {f:s.f[i]||0, t:s.t[i]||0};
    }
    for(const c in DATA.px){
      const s = DATA.px[c];
      if(s.c[i] !== null) px[c] = {c:s.c[i], h:s.h[i], l:s.l[i], v:s.v[i]};
    }
    if(!Object.keys(ins).length || !Object.keys(px).length) continue;
    try{ await fbPut('kawei/days/' + d, {ins, px}); ok++; }catch(e){ bad++; }
  }

  setStatus('上傳基本面快照…', true, false, 90);
  try{ await fbPut('kawei/fund', {at:DATA.fundAt || Date.now(), data:DATA.fund}); }catch(e){ bad++; }
  setStatus('上傳三率歷史…', true, false, 95);
  try{ await fbPut('kawei/hist', DATA.hist || {}); }catch(e){ bad++; }

  btn.disabled = false;
  el.innerHTML = `已上傳 <b style="color:var(--tx)">${ok}</b> 個交易日、基本面 ${Object.keys(DATA.fund).length} 檔`
               + (bad ? `，<span style="color:#ff9d9d">${bad} 項失敗</span>` : '。同事現在勾「只讀雲端」就能用了。');
  setStatus(`灌雲端完成：${ok} 個交易日。`, false, bad > 0);
}

function backDates(n){
  const out = [];
  const d = new Date();
  let guard = 0;
  while(out.length < n && guard++ < n*3){
    const w = d.getDay();
    if(w !== 0 && w !== 6) out.push(ymd(d));
    d.setDate(d.getDate() - 1);
  }
  return out.reverse();
}

/* ---------- 一天的法人買賣超（T86 接受 date 參數） ---------- */
async function fetchInst(date){
  const url = `https://www.twse.com.tw/rwd/zh/fund/T86?date=${date}&selectType=ALL&response=json`;
  const {data} = await getJSON(url);
  if(!data || data.stat !== 'OK' || !Array.isArray(data.data)) return null;
  const f = data.fields || [];
  const iCode = idxOf(f,'證券代號');
  const iFor  = idxOf(f,'外陸資買賣超股數','外資買賣超股數');
  const iTru  = idxOf(f,'投信買賣超股數');
  if(iCode < 0 || iFor < 0 || iTru < 0) throw new Error('T86 欄位對不上：' + f.join(' / '));
  const out = {};
  for(const r of data.data){
    const code = String(r[iCode]).trim();
    if(!/^\d{4}$/.test(code)) continue;
    out[code] = {f:(N(r[iFor])||0)/1000, t:(N(r[iTru])||0)/1000};
  }
  return out;
}

/* ---------- 一天的全市場行情（MI_INDEX） ---------- */
async function fetchPx(date){
  const url = `https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=${date}&type=ALL&response=json`;
  const {data} = await getJSON(url);
  if(!data || data.stat !== 'OK') return null;
  const tables = data.tables || (data.fields ? [data] : []);
  let tb = null;
  for(const t of tables){
    const f = t.fields || [];
    if(idxOf(f,'證券代號') >= 0 && idxOf(f,'收盤價') >= 0){ tb = t; break; }
  }
  if(!tb) return null;
  const f = tb.fields;
  const iCode = idxOf(f,'證券代號'), iName = idxOf(f,'證券名稱'),
        iC = idxOf(f,'收盤價'), iH = idxOf(f,'最高價'),
        iL = idxOf(f,'最低價'), iV = idxOf(f,'成交股數');
  const out = {};
  for(const r of tb.data){
    const code = String(r[iCode]).trim();
    if(!/^\d{4}$/.test(code)) continue;
    out[code] = {c:N(r[iC]), h:N(r[iH]), l:N(r[iL]), v:(N(r[iV])||0)/1000,
                 n: iName>=0 ? String(r[iName]).trim() : ''};
  }
  return out;
}

        got++;
      }
    }catch(e){ fails && fails.push(`產業別 ${TWSE_IND[t]}：${e.message}`); }
  }
  DATA.indAt = got ? Date.now() : 0;
  return got;
}

async function fetchFundamentals(fails, base, span){
  let valued = 0;
  const D = DATA.dates[DATA.dates.length-1] || ymd(new Date());
  for(let i=0;i<FUND_EPS.length;i++){
    const ep = FUND_EPS[i];
    setStatus(`抓基本面 ${i+1}/${FUND_EPS.length}：${ep.name}`, true, false,
              base + Math.round(i/FUND_EPS.length*span));
    const t0 = Date.now();
    const urls = [ep.url.replace('{D}', D)];
    if(ep.alt) urls.push(ep.alt);
    let ok = false, lastErr = null;

    for(const u of urls){
      try{
        const {data, via, viaName, bytes} = await getJSON(u);
        // www.twse.com.tw 的報表回的是 {stat,fields,data}，OpenAPI 回的是物件陣列
        const rows = Array.isArray(data) ? data : rwdToRows(data);
        if(!rows || !rows.length) throw new Error(Array.isArray(data) ? '回傳空陣列' : '回傳不是可用的表格');
        const st = ingestFund(ep, rows);
        valued += st.valued;
        PROBE[ep.id] = {ok:true, via, viaName, bytes, ms:Date.now()-t0,
                        count:rows.length, sample:rows[0]||null, st, usedUrl:u};
        if(st.valued === 0) fails.push(`${ep.name}：連到了 ${st.rows} 筆，但欄位對不上，一個值都沒抽到`);
        ok = true;
        break;
      }catch(e){ lastErr = e; }
    }
    if(!ok){
      PROBE[ep.id] = {ok:false, err:String(lastErr && lastErr.message || lastErr), ms:Date.now()-t0};
      fails.push(`${ep.name}：${lastErr && lastErr.message}`);
    }
  }
  return valued;
}

/* 把 www.twse.com.tw 報表格式（fields + data 陣列）攤平成物件陣列，
   這樣後面的模糊欄位比對可以共用一套邏輯 */
function rwdToRows(d){
  if(!d || d.stat !== 'OK') return null;
  const tables = d.tables || (d.fields ? [d] : []);
  const out = [];
  for(const t of tables){
    const f = t.fields || [];
    if(idxOf(f,'證券代號') < 0 && idxOf(f,'公司代號') < 0) continue;
    for(const r of (t.data || [])){
      const o = {};
      f.forEach((k, i) => o[String(k)] = r[i]);
      out.push(o);
    }
  }
  return out;
}
/* 回傳診斷數字：收到幾筆、幾筆認得出代號、幾筆真的抽到有效數值 */
function ingestFund(ep, rows){
  const st = {rows: rows.length, coded: 0, valued: 0, keys: rows[0] ? Object.keys(rows[0]) : []};
  for(const row of rows){
    const code = rowCode(row);
    if(!/^\d{4}$/.test(code)) continue;
    st.coded++;
    const r = fRec(code);
    if(!r.mkt) r.mkt = ep.mkt;
    const nm = K(row,'公司名稱','公司簡稱','CompanyName','Name');
    if(nm && !r.name) r.name = String(nm).trim();

    if(ep.kind === 'rev'){
      const ind = K(row,'產業別','Industry');
      if(ind && !r.ind) r.ind = String(ind).trim();
      r.rev = {
        period: String(K(row,'資料年月','DataYearMonth')||'').trim(),
        out   : String(K(row,'出表日期','OutDate')||'').trim(),
        yoy: N(K(row,'去年同月增減','LastYearSameMonth','YoY')),
        mom: N(K(row,'上月比較增減','LastMonth','MoM')),
        cumYoY: N(K(row,'前期比較增減','CumulativeIncrease'))
      };
    } else if(ep.kind === 'is'){
      const rv = N(K(row,'營業收入','OperatingRevenue','Revenue'));
      const gp = N(K(row,'營業毛利','GrossProfit'));
      const oi = N(K(row,'營業利益','OperatingIncome'));
      const ni = N(K(row,'歸屬於母公司業主','本期淨利','NetIncome','ProfitLoss'));
      // 期別欄位在不同端點叫法不同：有的是「年度_季度」一欄，有的拆成「年度」＋「季別」
      const yq = K(row,'年度_季度','年度季度','YearQuarter');
      const period = yq ? String(yq).trim()
        : (String(K(row,'年度','Year')||'') + 'Q' + String(K(row,'季別','季度','Season')||'')).replace(/^Q$/,'').trim();
      r.is = {
        period,
        out: String(K(row,'出表日期','OutDate')||'').trim(),
        eps: N(K(row,'每股盈餘','EPS')),
        rv, gp, oi, ni,
        gm: pct(gp,rv), om: pct(oi,rv), nm: pct(ni,rv)
      };
    } else if(ep.kind === 'bs'){
      const as = N(K(row,'資產總計','資產總額','TotalAssets'));
      const li = N(K(row,'負債總計','負債總額','TotalLiabilities'));
      const ca = N(K(row,'流動資產','CurrentAssets'));
      const cl = N(K(row,'流動負債','CurrentLiabilities'));
      r.bs = {debt: pct(li,as), cur: pct(ca,cl),
              out: String(K(row,'出表日期','OutDate')||'').trim()};
    } else if(ep.kind === 'val'){
      r.val = {
        pe: N(K(row,'PEratio','PERatio','PriceEarningRatio','本益比','PE')),
        pb: N(K(row,'PBratio','PBRatio','PriceBookRatio','股價淨值比','淨值比')),
        dy: N(K(row,'DividendYield','YieldRatio','殖利率'))
      };
    } else if(ep.kind === 'co'){
      const ind = K(row,'產業別','IndustryName','Industry');
      if(ind && !r.ind) r.ind = String(ind).trim();
      const cap = N(K(row,'實收資本額','PaidInCapital','CapitalStock'));
      const par = N(K(row,'普通股每股面額','ParValue')) || 10;   // 面額欄常寫成「新台幣 10.0000元」
      if(cap) r.co = {cap, par: par > 0 ? par : 10};
    }

    // 這一筆有沒有真的抽到東西？用來判斷「連到了但欄位對不上」
    const probe = ep.kind === 'rev' ? (r.rev && r.rev.yoy !== null && r.rev.yoy !== undefined)
                : ep.kind === 'is'  ? (r.is  && r.is.eps !== null && r.is.eps !== undefined)
                : ep.kind === 'bs'  ? (r.bs  && r.bs.debt !== null && r.bs.debt !== undefined)
                : ep.kind === 'val' ? (r.val && r.val.pe !== null && r.val.pe !== undefined)
                :                     (r.co  && r.co.cap > 0);
    if(probe) st.valued++;
  }
  return st;
}

async function runAll(){
  const btn = document.getElementById('btnRun');
  btn.disabled = true;
  fbSave();
  const fails = [];

  // --- 只讀雲端：整段跳過證交所 ---
  if(fbOnlyMode()){
    const r = await loadFromCloud(fails);
    DATA.runAt = Date.now();
    cacheSave(); cacheInfo();
    PROBE._fails = fails;
    renderProbe();
    score();
    btn.disabled = false;
    setStatus(
      DATA.dates.length
        ? `只讀雲端完成。新讀 <b>${r.days}</b> 天、基本面 <b>${r.fund}</b> 檔，`
          + `本機共 <b>${DATA.dates.length}</b> 個交易日${r.cloudDays?`（雲端有 ${r.cloudDays} 天）`:''}。`
          + (fails.length ? ` <span style="color:#ff9d9d">${fails.length} 項失敗。</span>` : '')
        : `<span style="color:#ff9d9d">雲端沒有讀到任何資料。</span>`
          + `請確認網址正確、資料庫規則允許讀取，且已經有人灌過資料。`,
      false, !DATA.dates.length);
    return;
  }

  const want = backDates(+document.getElementById('fDays').value || 25);
  const have = new Set(DATA.dates);
  const need = want.filter(d => !have.has(d));

  let fromCloud = 0, fromTwse = 0;

  let done = 0;
  for(const d of need){
    done++;
    const p = Math.round(done/Math.max(need.length,1)*60);

    // 先問雲端，抓過的日子不再跟證交所要
    if(fbReady()){
      setStatus(`雲端找 ${d}（${done}/${need.length}）`, true, false, p);
      try{
        const day = await fbGet('kawei/days/' + d);
        if(day && day.ins && day.px){ pushDay(d, day.ins, day.px); fromCloud++; continue; }
        if(day === 'holiday') continue;                   // 已知非交易日，直接跳過
      }catch(e){ fails.push(`Firebase 讀 ${d}：${e.message}`); }
    }

    setStatus(`抓 ${d} 的法人買賣超與行情（${done}/${need.length}）`, true, false, p);
    let ins = null, px = null;
    try{ ins = await fetchInst(d); }catch(e){ fails.push(`T86 ${d}：${e.message}`); }
    if(!ins){
      if(fbReady()){ try{ await fbPut('kawei/days/' + d, 'holiday'); }catch(e){} }
      continue;
    }
    try{ px = await fetchPx(d); }catch(e){ fails.push(`MI_INDEX ${d}：${e.message}`); }
    if(!px) continue;
    pushDay(d, ins, px);
    fromTwse++;
    if(fbReady()){
      setStatus(`上傳 ${d} 到雲端`, true, false, p);
      try{ await fbPut('kawei/days/' + d, {ins, px}); }catch(e){ fails.push(`Firebase 寫 ${d}：${e.message}`); }
    }
  }
  PROBE._src = {fromCloud, fromTwse};

  let stale = Date.now() - (DATA.fundAt||0) > 6*3600*1000;

  // 基本面也先問雲端。只要雲端的比本機新就收，不再要求 6 小時內——
  // 對抓不到證交所的人來說，舊快照遠好過沒有。
  if(stale && fbReady()){
    setStatus('雲端找基本面快照…', true, false, 62);
    try{
      const snap = await fbGet('kawei/fund');
      if(snap && snap.data && (snap.at || 0) >= (DATA.fundAt || 0)){
        for(const c in snap.data){
          const src = snap.data[c], dst = fRec(c);
          ['name','ind','mkt','rev','is','bs','val','co'].forEach(k => { if(src[k]) dst[k] = src[k]; });
        }
        DATA.fundAt = snap.at || Date.now();
        if(Date.now() - DATA.fundAt < 6*3600*1000) stale = false;
      }
    }catch(e){ fails.push(`Firebase 讀基本面：${e.message}`); }
  }

  if(stale || !fundLooksLoaded()){
    const got = await fetchFundamentals(fails, 60, 35);
    // 只有真的抽到值才蓋時間戳，否則下次進來會被當成「剛抓過」而整段跳過，
    // 一失敗就再也不重試（V3 的災情就是這樣來的）
    if(got > 0){
      DATA.fundAt = Date.now();
      if(fbReady()){
        setStatus('上傳基本面快照到雲端', true, false, 96);
        try{ await fbPut('kawei/fund', {at:DATA.fundAt, data:DATA.fund}); }
        catch(e){ fails.push(`Firebase 寫基本面：${e.message}`); }
      }
      await syncHist(fails);
    }else{
      DATA.fundAt = 0;
      fails.push('基本面一筆都沒抽到值，下次會自動重試');
    }
  }

  setStatus('計算估值與卡位分數…', true, false, 97);
  DATA.runAt = Date.now();

  // 產業別缺太多就用 MI_INDEX 分類代碼補一次（產業歸屬很少變，一天一次就夠）
  const noInd = Object.values(DATA.fund).filter(f => !f.ind).length;
  if(noInd > 200 && Date.now() - (DATA.indAt || 0) > 24*3600*1000){
    await fetchIndustries(fails);
  }

  cacheSave();
  cacheInfo();
  PROBE._fails = fails;
  renderProbe();
  score();
  btn.disabled = false;

  const s = PROBE._src || {};
  let msg = `完成。資料涵蓋 <b>${DATA.dates.length}</b> 個交易日，法人名單 <b>${ROWS.length}</b> 檔。`;
  if(s.fromCloud) msg += ` 其中 ${s.fromCloud} 天直接取自雲端、${s.fromTwse} 天新抓。`;
  if(fails.length) msg += ` <span style="color:#ff9d9d">${fails.length} 項失敗，到「資料源」看細節。</span>`;
  setStatus(msg, false, !DATA.dates.length);
}

function pushDay(date, ins, px){
  const dates = DATA.dates;
  let at = dates.indexOf(date);
  if(at < 0){
    at = dates.findIndex(x => x > date);
    if(at < 0) at = dates.length;
    dates.splice(at, 0, date);
    for(const c in DATA.px){ const s = DATA.px[c]; ['c','h','l','v'].forEach(k => s[k].splice(at,0,null)); }
    for(const c in DATA.ins){ const s = DATA.ins[c]; ['f','t'].forEach(k => s[k].splice(at,0,null)); }
  }
  const L = dates.length;
  const ensure = (obj, code, keys) => {
    if(!obj[code]){ obj[code] = {}; keys.forEach(k => obj[code][k] = new Array(L).fill(null)); }
    keys.forEach(k => { while(obj[code][k].length < L) obj[code][k].push(null); });
    return obj[code];
  };
  for(const code in px){
    const s = ensure(DATA.px, code, ['c','h','l','v']);
    s.c[at] = px[code].c; s.h[at] = px[code].h; s.l[at] = px[code].l; s.v[at] = px[code].v;
    if(px[code].n){ const fr = fRec(code); if(!fr.name) fr.name = px[code].n; }
  }
  for(const code in ins){
    const s = ensure(DATA.ins, code, ['f','t']);
    s.f[at] = ins[code].f; s.t[at] = ins[code].t;
  }
}

/* ==========================================================================
   指標
   ========================================================================== */
function contBuy(arr){
  let n = 0;
  for(let i = arr.length-1; i >= 0; i--){
    if(arr[i] === null){ if(n === 0) continue; else break; }
    if(arr[i] > 0) n++; else break;
  }
  return n;
}
function sumLast(arr, k){
  let s = 0, got = 0;
  for(let i = arr.length-1; i >= 0 && got < k; i--){
    if(arr[i] === null) continue;
    s += arr[i]; got++;
  }
  return got ? s : null;
}
function ma(arr, k){
  let s = 0, got = 0;
  for(let i = arr.length-1; i >= 0 && got < k; i--){
    if(arr[i] === null) continue;
    s += arr[i]; got++;
  }
  return got >= Math.min(k,5) ? s/got : null;
}
function lastVal(arr){
  for(let i = arr.length-1; i >= 0; i--) if(arr[i] !== null) return arr[i];
  return null;
}
function hiLo(arr, k, hi){
  let best = null, got = 0;
  for(let i = arr.length-1; i >= 0 && got < k; i--){
    if(arr[i] === null) continue;
    got++;
    best = (best === null) ? arr[i] : (hi ? Math.max(best,arr[i]) : Math.min(best,arr[i]));
  }
  return best;
}
/* 買超期間漲幅：從法人開始連買的前一日收盤算到現在 */
function runSincePct(c, backDays){
  const idxs = [];
  for(let i = 0; i < c.length; i++) if(c[i] !== null) idxs.push(i);
  if(idxs.length < 2) return null;
  const now = c[idxs[idxs.length-1]];
  const bi = Math.max(0, idxs.length - 1 - backDays);
  const base = c[idxs[bi]];
  return (base && now) ? (now-base)/base*100 : null;
}

function metrics(code){
  const p = DATA.px[code], q = DATA.ins[code];
  if(!p || !q) return null;
  const px = lastVal(p.c);
  if(!px) return null;

  const trustD = contBuy(q.t), foreignD = contBuy(q.f);
  const net5t = sumLast(q.t,5)||0, net5f = sumLast(q.f,5)||0;
  const net5 = net5t + net5f;
  const vol5 = sumLast(p.v,5), vol20 = ma(p.v,20);
  const buyDays = Math.max(trustD, foreignD, 5);
  const ma5 = ma(p.c,5), ma10 = ma(p.c,10), ma20 = ma(p.c,20), ma60 = ma(p.c,60);
  const hi20 = hiLo(p.h,20,true), lo20 = hiLo(p.l,20,false);
  const enough60 = DATA.dates.length >= 60;

  /* --- 投信「買多賣少」而不只是連買 --- */
  const win = (arr, k) => {
    const out = [];
    for(let i = arr.length-1; i >= 0 && out.length < k; i--) if(arr[i] !== null) out.push(arr[i]);
    return out;
  };
  const t10 = win(q.t, 10);
  const t10buy  = t10.filter(x => x > 0).length;
  const t10sell = t10.filter(x => x < 0).length;
  const recent2t = win(q.t, 2).reduce((a,b)=>a+b, 0);      // 投信最近兩個交易日淨買超
  const net5tOnly = sumLast(q.t, 5) || 0;
  const net20t  = sumLast(q.t, 20) || 0;
  const shares  = (f0 => f0 && f0.co && f0.co.cap > 0 ? f0.co.cap/(f0.co.par||10) : null)(DATA.fund[code]);
  const build20 = shares ? net20t * 1000 / shares * 100 : null;   // 張→股，佔股本比重

  /* --- 外資是不是在對倒 --- */
  const f5 = win(q.f, 5);
  const f5sellDays = f5.filter(x => x < 0).length;
  const net5fOnly  = f5.reduce((a,b)=>a+b, 0);

  /* --- 量能：溫和放大 vs 爆量 --- */
  const v5arr = win(p.v, 5);
  const v5avg = v5arr.length ? v5arr.reduce((a,b)=>a+b,0)/v5arr.length : null;
  const volRatio = (v5avg !== null && vol20) ? v5avg/vol20 : null;          // 近5日均量 ÷ 20日均量
  const volSpike = (vol20 && v5arr.length) ? Math.max(...v5arr)/vol20 : null; // 近5日最大單日量倍數

  /* --- 位階型態（只標籤，不參與評分） --- */
  const hiEx3 = (() => {          // 不含最近 3 日的 20 日高點，用來認頸線
    const out = [];
    let skipped = 0;
    for(let i = p.h.length-1; i >= 0 && out.length < 20; i--){
      if(p.h[i] === null) continue;
      if(skipped < 3){ skipped++; continue; }
      out.push(p.h[i]);
    }
    return out.length ? Math.max(...out) : null;
  })();
  const cAll = p.c.filter(x => x !== null);
  const c20ago = cAll.length >= 20 ? cAll[cAll.length-20] : cAll[0];
  const chg20 = c20ago ? (px - c20ago)/c20ago*100 : null;
  const distMA20 = ma20 ? (px-ma20)/ma20*100 : null;
  const wasBelow = (() => {       // 最近 5 天內曾經在 20 日線下方
    const cs = win(p.c, 6);
    return ma20 ? cs.slice(1).some(v => v < ma20) : false;
  })();
  const range20 = (hi20 && lo20) ? (hi20-lo20)/lo20*100 : null;

  let pattern = '趨勢中', patNote = '';
  if(distMA20 !== null && (distMA20 > 10 || (chg20 !== null && chg20 > 20))){
    pattern = '已噴出'; patNote = `距 20 日線 ${fmt(distMA20,1)}%、20 日漲幅 ${fmt(chg20,1)}%`;
  } else if(hiEx3 && px > hiEx3 && px <= hiEx3*1.05){
    pattern = '剛突破頸線'; patNote = `站上前高 ${fmt(hiEx3,2)}，突破幅度 ${fmt((px-hiEx3)/hiEx3*100,1)}%`;
  } else if(ma20 && wasBelow && px >= ma20){
    pattern = '剛站回均線'; patNote = `五日內曾在 20 日線下，今日收在 ${fmt(ma20,2)} 之上`;
  } else if(range20 !== null && range20 < 15){
    pattern = '打底整理'; patNote = `20 日振幅僅 ${fmt(range20,1)}%`;
  } else if(distMA20 !== null && distMA20 >= -4 && distMA20 <= 2){
    pattern = '回檔測均線'; patNote = `貼著 20 日線 ${fmt(ma20,2)}`;
  } else if(distMA20 !== null && distMA20 < -4){
    pattern = '均線之下'; patNote = `低於 20 日線 ${fmt(Math.abs(distMA20),1)}%`;
  }

  /* --- 參考防守位：現價下方最近的一道支撐 --- */
  const cands = [];
  if(ma20 && ma20 < px) cands.push(['MA20', ma20]);
  if(lo20 && lo20 < px) cands.push(['20日低', lo20]);
  if(hiEx3 && hiEx3 < px) cands.push(['頸線', hiEx3]);
  cands.sort((a,b) => b[1]-a[1]);
  const sup = cands[0] || null;

  return {
    px, trustD, foreignD, net5, net5t, net5f, vol20,
    t10buy, t10sell, net20t, build20, shares, recent2t, net5tOnly,
    f5sellDays, net5fOnly, volRatio, volSpike,
    pattern, patNote, chg20, range20, hiEx3,
    supName: sup ? sup[0] : null, supPx: sup ? sup[1] : null,
    supGap: sup ? (px - sup[1])/px*100 : null,
    absorb  : vol5 ? net5/vol5*100 : null,
    runPct  : runSincePct(p.c, buyDays),
    toHigh  : hi20 ? (px-hi20)/hi20*100 : null,
    fromLow : lo20 ? (px-lo20)/lo20*100 : null,
    distMA20,
    aboveMA60: (enough60 && ma60 !== null) ? px > ma60 : null,
    ma5, ma10, ma20, ma60, hi20, lo20
  };
}

/* ==========================================================================
   評分：法人卡位 40 ／ 基本面 35 ／ 空間 25
   缺資料標 null，滿分從分母扣掉，最後按比例還原
   ========================================================================== */
function band(v, table){
  for(const [th,pt,note] of table) if(v >= th) return {pt,note};
  const l = table[table.length-1];
  return {pt:l[1], note:l[2]};
}
function bandLow(v, table){
  for(const [th,pt,note] of table) if(v > th) return {pt,note};
  const l = table[table.length-1];
  return {pt:l[1], note:l[2]};
}
function P(label, max, v, res){
  return {label, max, val:v, pt: res ? res.pt : null, note: res ? res.note : '無資料'};
}

/* ==========================================================================
   估值：市值、近四季 EPS、合理價區間、溢價
   本益比與股價淨值比直接取自交易所（BWIBBU_ALL / TPEx），
   由它們反推「近四季 EPS」與「每股淨值」，不必自己拼財報歷史。
     EPS(近4季) = 收盤價 ÷ 本益比
     每股淨值   = 收盤價 ÷ 股價淨值比
     市值       = 收盤價 × (實收資本額 ÷ 每股面額)
   合理價用「同產業本益比的四分位」當錨，因為個股歷史本益比帶需要多年資料。
   ========================================================================== */
let PEBAND = {byInd:{}, all:null};

function quantile(sorted, q){
  if(!sorted.length) return null;
  const i = (sorted.length - 1) * q;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? sorted[lo] : sorted[lo] + (sorted[hi]-sorted[lo])*(i-lo);
}
function buildPEBands(){
  const byInd = {}, all = [];
  for(const code in DATA.fund){
    const f = DATA.fund[code];
    const pe = f.val && f.val.pe;
    if(!(pe > 0) || pe > 100) continue;                 // 本益比過高多半是獲利趨近於零，排除
    if(isFinancial(code, f.name, f.ind)) continue;      // 金融股本益比結構不同，不混進來
    if(!f.ind) continue;                                // 沒有產業別的不納入取樣
    all.push(pe);
    (byInd[f.ind] = byInd[f.ind] || []).push(pe);
  }
  all.sort((a,b)=>a-b);
  const mk = arr => {
    arr.sort((a,b)=>a-b);
    return {n:arr.length, p25:quantile(arr,0.25), p50:quantile(arr,0.5), p75:quantile(arr,0.75)};
  };
  PEBAND = {byInd:{}, all: all.length >= 30 ? mk(all) : null};
  for(const k in byInd) if(byInd[k].length >= 8) PEBAND.byInd[k] = mk(byInd[k]);
}

function valuation(code, px, f){
  const val = f.val || {}, co = f.co || null;
  const pe = (val.pe > 0 && val.pe <= 300) ? val.pe : null;
  const pb = (val.pb > 0) ? val.pb : null;

  const epsTTM = (pe && px) ? px / pe : null;           // 近四季 EPS，由本益比反推
  const bvps   = (pb && px) ? px / pb : null;           // 每股淨值

  let shares = null, mcap = null;
  if(co && co.cap > 0){
    shares = co.cap / (co.par || 10);
    mcap   = px ? px * shares / 1e8 : null;
  }

  /* 合理價只在「有同產業樣本」時才算。
     少了產業別就退回全市場分位的話，水泥、營建這種成熟股會被電子股的高本益比
     拉出一個它從來沒到過的目標價（亞泥算出 100 元就是這樣來的），寧可不給。 */
  const ind  = f.ind || '';
  const band = ind ? PEBAND.byInd[ind] : null;
  let lo = null, mid = null, hi = null, prem = null, bandSrc = null, bandWhy = null;
  let peVsInd = null, spread = null;

  if(band && pe) peVsInd = pe / band.p50;      // 市場給的本益比是同業中位數的幾倍

  if(!ind){
    bandWhy = '缺產業別，無法跟同業比';
  } else if(!band){
    bandWhy = `${ind} 樣本不足 8 檔，同業分位不可靠`;
  } else if(epsTTM === null){
    bandWhy = '交易所沒給本益比（多半是近四季虧損）';
  } else if(epsTTM <= 0){
    bandWhy = '近四季 EPS 非正數';
  } else if(peVsInd !== null && peVsInd >= 3){
    /* 市場給的倍數遠高於同業，代表它在為「未來獲利」定價：轉型、題材、獲利拐點。
       這種股票用「落後四季 EPS × 同業中位數」算出來的數字必然低得離譜，
       而且看起來很精確、很容易被當真。寧可不給。 */
    bandWhy = `市場給的本益比是同業中位數的 ${peVsInd.toFixed(1)} 倍`
            + `（${fmt(pe,0)} vs ${fmt(band.p50,0)}），代表在為未來獲利定價，`
            + `用落後四季 EPS 估值不適用`;
  } else {
    const cap = v => Math.min(v, 30);
    lo  = epsTTM * cap(band.p25);
    mid = epsTTM * cap(band.p50);
    hi  = epsTTM * cap(band.p75);
    prem = (px - mid) / mid * 100;
    bandSrc = `${ind}（${band.n} 檔）`;
    spread = band.p75 / band.p25;          // 同業本益比離散程度
  }
  return {pe, pb, epsTTM, bvps, shares, mcap, lo, mid, hi, prem, band, bandSrc, bandWhy, peVsInd, spread};
}

function scoreOne(m, f, V){
  const A = [], B = [], C = [];

  A.push(P('投信連買天數', 12, m.trustD, band(m.trustD, [
    [5,12,'投信連買 5 日以上，主動買盤'],[3,9,'投信連買 3 日'],[2,5,'投信連買 2 日'],
    [1,2,'投信今日買超'],[0,0,'投信沒買']])));
  A.push(P('外資連買天數', 8, m.foreignD, band(m.foreignD, [
    [5,8,'外資連買 5 日以上'],[3,6,'外資連買 3 日'],[2,3,'外資連買 2 日'],
    [1,1,'外資今日買超'],[0,0,'外資沒買']])));
  A.push(P('吸籌強度（近5日買超÷成交量）', 12, m.absorb, m.absorb===null ? null : band(m.absorb, [
    [8,12,'法人吃掉近 8% 以上的量'],[5,9,'吸籌明顯'],[3,6,'吸籌中等'],[1,3,'小量吸籌'],
    [-1e9,0,'近 5 日法人合計是賣超']])));
  A.push(P('外資投信同步', 8, null,
    (m.trustD>=3 && m.foreignD>=3) ? {pt:8,note:'外資投信同步連買 3 日以上'} :
    (m.trustD>0 && m.foreignD>0)   ? {pt:5,note:'外資投信今日同步買超'} :
    (m.trustD>0 || m.foreignD>0)   ? {pt:2,note:'只有單一法人在買'} :
                                     {pt:0,note:'兩者都沒買'}));

  const rev = f.rev||{}, is = f.is||{}, bs = f.bs||{}, val = f.val||{};
  const g = (o,k) => (o && o[k] !== null && o[k] !== undefined && isFinite(o[k])) ? o[k] : null;
  const yoy = g(rev,'yoy'), om = g(is,'om'), eps = g(is,'eps'), debt = g(bs,'debt');
  const pe = (g(val,'pe') > 0) ? val.pe : null;

  B.push(P('營收年增率', 12, yoy, yoy===null ? null : band(yoy, [
    [30,12,'年增 ≥30%'],[15,10,'年增 ≥15%'],[5,6,'年增 ≥5%'],[0,3,'年增為正'],[-1e9,0,'營收年減']])));
  B.push(P('營業利益率', 9, om, om===null ? null : band(om, [
    [20,9,'本業非常賺'],[12,7,'本業賺'],[6,5,'本業普通'],[2,2,'本業微利'],[0,1,'接近損益兩平'],
    [-1e9,0,'本業虧損']])));
  B.push(P('單季 EPS', 9, eps, eps===null ? null : band(eps, [
    [5,9,'EPS ≥5 元'],[3,7,'EPS ≥3 元'],[1.5,5,'EPS ≥1.5 元'],[0,2,'小幅獲利'],[-1e9,0,'虧損']])));
  B.push(P('負債比', 5, debt, debt===null ? null : bandLow(debt, [
    [75,0,'負債比過高'],[60,1,'負債比偏高'],[45,3,'負債比中等'],[30,4,'負債比低'],[-1e9,5,'負債比很低']])));
  B.push(P('本益比', 5, pe, pe===null ? null : bandLow(pe, [
    [40,0,'本益比偏貴'],[25,1,'本益比略高'],[18,3,'本益比合理'],[12,4,'本益比偏低'],[-1e9,5,'本益比很低']])));

  C.push(P('買超期間漲幅', 9, m.runPct, m.runPct===null ? null : bandLow(m.runPct, [
    [20,0,'已經噴出去了，不叫卡位'],[15,1,'漲幅偏大，追價風險'],[10,3,'漲了一段'],
    [5,7,'小漲，還算低檔'],[-1e9,9,'法人在買但股價幾乎沒動']])));
  C.push(P('距 20 日高點', 6, m.toHigh, m.toHigh===null ? null : bandLow(m.toHigh, [
    [-2,2,'貼著或站上 20 日高點'],[-5,4,'接近前高'],[-10,5,'距前高還有空間'],[-1e9,6,'離前高很遠']])));
  C.push(P('距 MA20', 4, m.distMA20, m.distMA20===null ? null :
    (m.distMA20 >= -3 && m.distMA20 <= 3) ? {pt:4,note:'貼著 20 日線，剛整理完'} :
    (m.distMA20 > 3 && m.distMA20 <= 7)   ? {pt:3,note:'剛離開 20 日線'} :
    (m.distMA20 > 7)                       ? {pt:1,note:'已遠離 20 日線，位階偏高'} :
                                             {pt:1,note:'在 20 日線下方，趨勢還沒轉'}));
  C.push(P('相對同業估值', 6, V.prem, (V.prem===null) ? null : bandLow(V.prem, [
    [40,0,'比同業貴四成以上'],[20,1,'明顯高於同業'],[5,3,'略高於同業'],
    [-15,5,'低於同業中位數'],[-1e9,6,'相對同業明顯便宜']])));

  const roll = arr => {
    let got = 0, den = 0, filled = 0;
    for(const p of arr){ if(p.pt === null) continue; got += p.pt; den += p.max; filled++; }
    return {got, den, filled};
  };
  const rA = roll(A), rB = roll(B), rC = roll(C);
  const got = rA.got + rB.got + rC.got;
  const den = rA.den + rB.den + rC.den;
  const filled = rA.filled + rB.filled + rC.filled;
  const total = A.length + B.length + C.length;

  return {
    A, B, C,
    score: den ? Math.round(got/den*100) : null,
    sChip: rA.den ? Math.round(rA.got/rA.den*40) : null,
    sFund: rB.den ? Math.round(rB.got/rB.den*35) : null,
    sRoom: rC.den ? Math.round(rC.got/rC.den*25) : null,
    hasFund: rB.den > 0,
    cmp  : Math.round(filled/total*100)
  };
}

/* ==========================================================================
   三率三升
   毛利率、營業利益率、稅後淨利率 三者同時較上一期上升。
   需要兩期財報才算得出來，所以每次抓到新的一期就把三率存進
   DATA.hist[期別][代號]，並同步到 Firebase /kawei/hist。
   在還沒有第二期以前，退而用「營收動能」給一個推測燈號——
   那是推測不是事實，欄位會標示清楚。
   ========================================================================== */
function snapMargins(){
  DATA.hist = DATA.hist || {};
  let n = 0;
  for(const c in DATA.fund){
    const is = DATA.fund[c].is;
    if(!is || !is.period) continue;
    if(is.gm === null && is.om === null && is.nm === null) continue;
    (DATA.hist[is.period] = DATA.hist[is.period] || {})[c] = {gm:is.gm, om:is.om, nm:is.nm, eps:is.eps};
    n++;
  }
  return n;
}
/* 各期三率存雲端，這樣「三率三升」會隨每季自動累積，不必手動灌任何數字 */
async function syncHist(fails){
  snapMargins();
  if(!fbReady()) return;
  try{
    const cloud = await fbGet('kawei/hist');
    if(cloud) for(const p in cloud) DATA.hist[p] = Object.assign({}, cloud[p], DATA.hist[p] || {});
    await fbPut('kawei/hist', DATA.hist);
  }catch(e){ if(fails) fails.push(`Firebase 三率歷史：${e.message}`); }
}

function prevPeriodOf(period){
  const keys = Object.keys(DATA.hist || {}).sort();
  const i = keys.indexOf(period);
  return i > 0 ? keys[i-1] : null;
}
function triMargins(code, f){
  const is = f.is || {};
  if(!is.period) return {state:'none', why:'沒有財報資料'};

  const prevP = prevPeriodOf(is.period);
  const prev = prevP && DATA.hist[prevP] ? DATA.hist[prevP][code] : null;

  if(prev){
    const d = k => (is[k] !== null && prev[k] !== null && is[k] !== undefined && prev[k] !== undefined)
                   ? is[k] - prev[k] : null;
    const dg = d('gm'), dm = d('om'), dn = d('nm');
    if(dg === null || dm === null || dn === null)
      return {state:'none', why:`${prevP} 那期的三率不完整`};
    const up = [dg,dm,dn].filter(x => x > 0).length;
    return {
      state: up === 3 ? 'three' : (up === 0 ? 'down' : 'part'),
      up, dg, dm, dn, prevP,
      why: `對比 ${prevP}：毛利率 ${dg>0?'+':''}${dg.toFixed(2)}、營益率 ${dm>0?'+':''}${dm.toFixed(2)}、淨利率 ${dn>0?'+':''}${dn.toFixed(2)}（百分點）`
    };
  }

  // 還沒有上一期 → 用營收動能推測，明確標示是推測
  const rev = f.rev || {};
  const yoy = rev.yoy, mom = rev.mom;
  if(yoy === null || yoy === undefined) return {state:'wait', why:'只有一期財報，且沒有營收資料可推測'};
  const strong = yoy >= 15 && mom !== null && mom > 0;
  const ok     = yoy >= 5;
  return {
    state: 'guess', guessUp: strong ? 2 : (ok ? 1 : 0),
    why: `目前只有 ${is.period} 一期財報，算不出實際變化。依營收動能推測：年增 ${fmt(yoy,1)}%、月增 ${fmt(mom,1)}%`
       + (strong ? '，營收放大有機會帶動三率同步改善' : ok ? '，營收溫和成長，三率方向不明' : '，營收動能不足，三率改善機會低')
  };
}
function triChip(t){
  if(!t) return '<span class="na">—</span>';
  if(t.state === 'three') return '<span class="tri t3">三率三升</span>';
  if(t.state === 'part')  return `<span class="tri t2">${t.up} 升</span>`;
  if(t.state === 'down')  return '<span class="tri t0">三率齊跌</span>';
  if(t.state === 'guess') return `<span class="tri tg">推測 ${t.guessUp===2?'偏正面':t.guessUp===1?'中性':'偏負面'}</span>`;
  if(t.state === 'wait')  return '<span class="tri tw">待累積</span>';
  return '<span class="na">—</span>';
}

function tagsFor(m, f, s, V){
  const t = [];
  if(!s.hasFund) t.push(['⚠ 沒有基本面資料','bad']);
  if(V && V.peVsInd !== null && V.peVsInd >= 3)
    t.push(['市場給'+V.peVsInd.toFixed(0)+'倍同業本益比','']);
  if(V && V.pb !== null && V.pb < 1) t.push(['股價低於淨值','good']);
  if(V && V.prem !== null && V.prem <= -15) t.push(['相對同業便宜','good']);
  if(V && V.prem !== null && V.prem >= 40) t.push(['估值偏貴','bad']);
  if(m.trustD >= 3) t.push(['投信連買'+m.trustD+'日','tr']);
  if(m.trustD >= 3 && m.foreignD >= 3) t.push(['外資投信同步','good']);
  if(m.absorb !== null && m.absorb >= 8) t.push(['法人強吸籌','good']);
  if(m.runPct !== null && m.runPct < 3 && (m.trustD >= 3 || m.foreignD >= 3))
    t.push(['🎯 買超但沒漲','good']);
  if(m.runPct !== null && m.runPct >= 15) t.push(['追價風險','bad']);
  if(m.toHigh !== null && m.toHigh > -2) t.push(['已到前高','bad']);
  const yoy = f.rev ? f.rev.yoy : null;
  if(yoy !== null && yoy !== undefined && yoy >= 15) t.push(['營收年增'+fmt(yoy,0)+'%','good']);
  if(yoy !== null && yoy !== undefined && yoy < 0) t.push(['營收年減','bad']);
  if(f.is && f.is.om !== null && f.is.om !== undefined && f.is.om >= 20) t.push(['本業高獲利','good']);
  if(f.is && f.is.eps !== null && f.is.eps !== undefined && f.is.eps <= 0) t.push(['單季虧損','bad']);
  if(m.aboveMA60 === false) t.push(['季線之下','bad']);
  if(s.cmp < 60) t.push(['資料不全','']);
  return t;
}

function score(){
  ROWS = [];
  const inds = new Set();
  const noFin  = document.getElementById('fNoFin').checked;
  const noLoss = document.getElementById('fNoLoss').checked;
  buildPEBands();
  snapMargins();

  for(const code in DATA.ins){
    const m = metrics(code);
    if(!m) continue;
    if(m.trustD === 0 && m.foreignD === 0 && m.net5 <= 0) continue;   // 法人沒在買
    if(m.vol20 !== null && m.vol20 < 1000) continue;                  // 沿用 1000 張門檻

    const f = DATA.fund[code] || {rev:{},is:{},bs:{},val:{}};
    const name = f.name || code;
    const fin = isFinancial(code, name, f.ind);
    if(noFin && fin) continue;
    if(noLoss && f.is && f.is.eps !== null && f.is.eps !== undefined && f.is.eps <= 0) continue;

    const V = valuation(code, m.px, f);
    const s = scoreOne(m, f, V);
    if(s.score === null) continue;
    if(f.ind) inds.add(f.ind);

    const TRI = triMargins(code, f);
    const SIG = signalOf(m);
    const sigRank = {watch:5, hold:4, none:3, late:2, warn:1, exit:0}[SIG.k];
    // 財報日期：優先用出表日期，沒有就照使用者要求統一退回最後一個交易日
    const rawOut = (f.is && f.is.out) || (f.bs && f.bs.out) || '';
    const repDate = rawOut ? roc2ad(rawOut) : (lastTradeDate() + '※');
    const triRank = {three:4, part:3, guess:2, wait:1, down:0, none:-1}[TRI.state];

    ROWS.push({
      code, name, ind: f.ind || '—', mkt: f.mkt || '上市', fin,
      score:s.score, sChip:s.sChip, sFund:s.sFund, sRoom:s.sRoom, cmp:s.cmp,
      hasFund:s.hasFund, S:s, M:m, V,
      trustD:m.trustD, foreignD:m.foreignD, net5:Math.round(m.net5),
      t10buy:m.t10buy, t10sell:m.t10sell, net20t:m.net20t, build20:m.build20,
      f5sellDays:m.f5sellDays, net5fOnly:m.net5fOnly,
      volRatio:m.volRatio, volSpike:m.volSpike,
      pattern:m.pattern, patNote:m.patNote,
      supName:m.supName, supPx:m.supPx, supGap:m.supGap,
      absorb:m.absorb, runPct:m.runPct, toHigh:m.toHigh, distMA20:m.distMA20, px:m.px,
      revYoY:(f.rev && f.rev.yoy !== undefined) ? f.rev.yoy : null,
      revMoM:(f.rev && f.rev.mom !== undefined) ? f.rev.mom : null,
      gm:(f.is && f.is.gm !== undefined) ? f.is.gm : null,
      om:(f.is && f.is.om !== undefined) ? f.is.om : null,
      nm:(f.is && f.is.nm !== undefined) ? f.is.nm : null,
      eps:(f.is && f.is.eps !== undefined) ? f.is.eps : null,
      TRI, triScore:triRank, repDate, SIG, sigRank,
      epsTTM:V.epsTTM, mcap:V.mcap, pe:V.pe, fair:V.mid, prem:V.prem,
      tags: tagsFor(m, f, s, V),
      revPeriod:(f.rev && f.rev.period)||'', isPeriod:(f.is && f.is.period)||''
    });
  }

  const sel = document.getElementById('fInd');
  const keep = sel.value;
  sel.innerHTML = '<option value="">全部</option>' + [...inds].sort().map(i=>`<option>${i}</option>`).join('');
  sel.value = keep;
  render();
}

/* ==========================================================================
   畫面
   ========================================================================== */
function filtered(){
  const min   = +document.getElementById('fScore').value || 0;
  const trust = +document.getElementById('fTrust').value || 0;
  const runMx = document.getElementById('fRun').value;
  const yoy   = document.getElementById('fYoY').value;
  const ind   = document.getElementById('fInd').value;
  const q     = document.getElementById('fQ').value.trim();
  const tOnly = document.getElementById('fTrustOnly').checked;
  const prem  = document.getElementById('fPrem').value;
  const hasF  = document.getElementById('fHasFund').checked;
  const t10   = document.getElementById('fT10').value;
  const netD  = document.getElementById('fNetD').value;
  const volM  = document.getElementById('fVol').value;
  const pat   = document.getElementById('fPat').value;
  const noDump= document.getElementById('fNoDump').checked;
  const sig   = document.getElementById('fSig').value;

  let out = ROWS.filter(r => {
    if(r.score < min) return false;
    if(r.trustD < trust) return false;
    if(tOnly && r.trustD === 0) return false;
    if(hasF && !r.hasFund) return false;
    if(prem !== '' && (r.prem === null || r.prem > +prem)) return false;
    if(t10 !== '' && r.t10buy < +t10) return false;
    if(netD !== '' && (r.t10buy - r.t10sell) < +netD) return false;
    if(volM === 'mild'    && !(r.volRatio !== null && r.volRatio >= 1.2 && r.volRatio <= 3)) return false;
    if(volM === 'nospike' && !(r.volSpike !== null && r.volSpike <= 5)) return false;
    if(pat === '__early'  && !['打底整理','剛突破頸線','剛站回均線'].includes(r.pattern)) return false;
    if(pat && pat !== '__early' && r.pattern !== pat) return false;
    if(noDump && r.f5sellDays >= 3 && r.net5fOnly < 0) return false;
    if(sig && (!r.SIG || r.SIG.k !== sig)) return false;
    if(runMx !== '' && r.runPct !== null && r.runPct > +runMx) return false;
    if(yoy !== '' && (r.revYoY === null || r.revYoY < +yoy)) return false;
    if(ind && r.ind !== ind) return false;
    if(q && r.code.indexOf(q) < 0 && r.name.indexOf(q) < 0) return false;
    return true;
  });

  const k = SORT.k, d = SORT.dir;
  out.sort((a,b) => {
    let x = a[k], y = b[k];
    if(typeof x === 'string' || typeof y === 'string')
      return String(x||'').localeCompare(String(y||'')) * d;
    if(x === null || x === undefined) return 1;
    if(y === null || y === undefined) return -1;
    return (x-y)*d;
  });
  return out;
}
function cls(v){ return (v===null||v===undefined) ? 'na' : (v>0?'pos':(v<0?'neg':'')); }
function dots(n,k,cl){
  let h = '<span class="dots">';
  for(let i=0;i<k;i++) h += `<i class="${i<n?cl:''}"></i>`;
  return h + '</span>';
}

/* ---------- 資料日期橫幅：每一層資料各自是什麼時候的 ---------- */
function roc2ad(s){                       // 1150730 → 2026/07/30；11507 → 2026/07
  s = String(s||'').trim();
  if(/^\d{7}$/.test(s)) return (+s.slice(0,3)+1911) + '/' + s.slice(3,5) + '/' + s.slice(5,7);
  if(/^\d{6}$/.test(s)) return (+s.slice(0,3)+1911) + '/' + s.slice(3,5);
  if(/^\d{5}$/.test(s)) return (+s.slice(0,3)+1911) + '/' + s.slice(3,5);
  return s || '—';
}
function lastTradeDate(){
  const d = DATA.dates[DATA.dates.length-1];
  return d ? d.slice(0,4) + '/' + d.slice(4,6) + '/' + d.slice(6,8) : '—';
}
function commonest(arr){
  const c = {};
  for(const v of arr) if(v) c[v] = (c[v]||0)+1;
  let best = null, n = 0;
  for(const k in c) if(c[k] > n){ best = k; n = c[k]; }
  return best;
}
function renderVintage(){
  const el = document.getElementById('vintage');
  if(!el) return;
  if(!DATA.dates.length){ el.innerHTML = ''; return; }

  const last = DATA.dates[DATA.dates.length-1];
  const d = last.slice(0,4) + '/' + last.slice(4,6) + '/' + last.slice(6,8);
  const revP = commonest(Object.values(DATA.fund).map(f => f.rev && f.rev.period));
  const isP  = commonest(Object.values(DATA.fund).map(f => f.is && f.is.period));
  const at   = DATA.runAt ? new Date(DATA.runAt) : null;
  const atS  = at ? `${at.getMonth()+1}/${at.getDate()} ${String(at.getHours()).padStart(2,'0')}:${String(at.getMinutes()).padStart(2,'0')}` : '—';
  const withFund = ROWS.filter(r => r.hasFund).length;
  const staleFund = !Object.keys(DATA.fund).length ||
                    !Object.values(DATA.fund).some(f => f.is && f.is.eps !== undefined);

  el.innerHTML = `
    <div class="vi"><div class="k">法人與行情</div><div class="v">${d}</div>
      <div class="s">共 ${DATA.dates.length} 個交易日</div></div>
    <div class="vi"><div class="k">月營收</div><div class="v">${roc2ad(revP)}</div>
      <div class="s">每月 10 日前公告</div></div>
    <div class="vi ${staleFund?'warnv':''}"><div class="k">財報</div><div class="v">${isP || '—'}</div>
      <div class="s">${withFund} 檔有基本面資料</div></div>
    <div class="vi"><div class="k">雲端快取</div>
      <div class="v">${fbOnlyMode() ? '只讀雲端' : (fbReady() ? '已啟用' : '未啟用')}</div>
      <div class="s">${fbOnlyMode() ? '完全不連證交所' : (fbReady() ? '抓過的日子不再重抓' : '在「資料源」分頁設定')}</div></div>
    <div class="vi"><div class="k">最後更新</div><div class="v">${atS}</div>
      <div class="s">按「更新並篩選」才會變</div></div>`;
}

/* ==========================================================================
   欄位顯示控制
   用 nth-child 直接隱藏整欄，不用改表格內容。分組是為了讓「這欄在講什麼」一目了然。
   ========================================================================== */
const COL_GROUPS = [
  ['基本', ['code','name','ind','score','sigRank']],
  ['三軸分數', ['sChip','sFund','sRoom']],
  ['籌碼', ['pattern','trustD','t10buy','foreignD','net5','net20t','build20','absorb','volRatio']],
  ['位階', ['runPct','toHigh','distMA20','supPx','supGap']],
  ['基本面', ['revPeriod','revYoY','revMoM','gm','om','nm','triScore','repDate']],
  ['估值', ['epsTTM','px','mcap','pe','fair','prem']]
];
const COL_LOCK = ['code','name','score','sigRank'];                 // 這幾欄不給關
const COL_HIDE_DEFAULT = ['volRatio','runPct','toHigh','distMA20','absorb','sChip','sRoom'];
const COL_CORE = ['code','name','ind','score','sigRank','pattern','trustD','t10buy','net20t','build20',
                  'revPeriod','revYoY','revMoM','gm','om','triScore','epsTTM','px','pe','fair','prem'];
const COL_KEY = 'kawei_cols_v8';
let COL_HIDDEN = new Set(COL_HIDE_DEFAULT);
let COL_ORDER = [];      // data-k 依表格實際順序

function colInit(){
  COL_ORDER = [...document.querySelectorAll('#tbl thead th')].map(th => th.dataset.k);
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem(COL_KEY)); }catch(e){}
  // 沒存過就用「只留核心」開場，欄位太多一次攤開根本看不完
  COL_HIDDEN = Array.isArray(saved)
    ? new Set(saved)
    : new Set(COL_ORDER.filter(k => !COL_CORE.includes(k)));
  COL_LOCK.forEach(k => COL_HIDDEN.delete(k));
  colApply();
  colPanel();
}
function colApply(){
  let css = '';
  COL_ORDER.forEach((k, i) => {
    if(COL_HIDDEN.has(k)) css += `#tbl th:nth-child(${i+1}),#tbl td:nth-child(${i+1}){display:none}`;
  });
  let el = document.getElementById('colhide');
  if(!el){ el = document.createElement('style'); el.id = 'colhide'; document.head.appendChild(el); }
  el.textContent = css;
  const shown = COL_ORDER.length - COL_HIDDEN.size;
  const cc = document.getElementById('colCount');
  if(cc) cc.textContent = `顯示 ${shown} / ${COL_ORDER.length} 欄`;
  try{ localStorage.setItem(COL_KEY, JSON.stringify([...COL_HIDDEN])); }catch(e){}
}
function colLabel(k){
  const th = [...document.querySelectorAll('#tbl thead th')].find(t => t.dataset.k === k);
  return th ? th.textContent.trim() : k;
}
function colPanel(){
  const p = document.getElementById('colPanel');
  if(!p) return;
  p.innerHTML = COL_GROUPS.map(([g, keys]) => {
    const items = keys.filter(k => COL_ORDER.includes(k)).map(k => {
      const lock = COL_LOCK.includes(k);
      return `<label class="${lock?'locked':''}">
        <input type="checkbox" data-col="${k}" ${COL_HIDDEN.has(k)?'':'checked'} ${lock?'disabled':''}>
        ${colLabel(k)}</label>`;
    }).join('');
    return items ? `<div class="colgrp">${g}</div><div class="colgrid">${items}</div>` : '';
  }).join('');
  p.querySelectorAll('input[data-col]').forEach(cb => {
    cb.onchange = () => {
      if(cb.checked) COL_HIDDEN.delete(cb.dataset.col); else COL_HIDDEN.add(cb.dataset.col);
      colApply();
    };
  });
}
function colSet(visible){
  COL_HIDDEN = new Set(COL_ORDER.filter(k => !visible.includes(k) && !COL_LOCK.includes(k)));
  colApply(); colPanel();
}

/* ==========================================================================
   訊號：上車／續抱／下車
   刻意不看估值。估值回答「值不值得關注」，籌碼與位階才回答「現在該不該動」。
   判定由重到輕，先中先算——先確認要不要離場，再談要不要進場。
   ========================================================================== */
function signalOf(m){
  // --- 離場條件優先 ---
  if(m.net5tOnly < 0 && m.trustD === 0)
    return {k:'exit', label:'投信轉賣', why:`近 5 日投信淨賣超 ${Math.abs(Math.round(m.net5tOnly)).toLocaleString()} 張，進場理由已消失`};

  if(m.supPx !== null && m.px < m.supPx)
    return {k:'exit', label:'跌破防守', why:`收盤 ${fmt(m.px,2)} 已跌破${m.supName} ${fmt(m.supPx,2)}`};

  if(m.recent2t <= 0 && m.trustD === 0 && m.t10buy > 0)
    return {k:'warn', label:'買盤中斷', why:'投信最近兩個交易日沒有買超，先前的連買段落可能結束'};

  if(m.runPct !== null && m.runPct >= 20)
    return {k:'late', label:'已發動', why:`買超期間已漲 ${fmt(m.runPct,1)}%，這時候進場是追價不是卡位`};

  // --- 進場觀察 ---
  const early = ['打底整理','剛突破頸線','剛站回均線'].includes(m.pattern);
  const buying = (m.t10buy - m.t10sell) >= 2 || m.trustD >= 3;
  const noDump = !(m.f5sellDays >= 3 && m.net5fOnly < 0);
  const quiet  = m.runPct === null || m.runPct <= 10;

  if(early && buying && noDump && quiet)
    return {k:'watch', label:'可觀察',
      why:`${m.pattern}＋投信 10 日買 ${m.t10buy} 賣 ${m.t10sell} 天，期間僅漲 ${fmt(m.runPct,1)}%，`
        + `${m.supName ? `防守看${m.supName} ${fmt(m.supPx,2)}` : '尚無明確防守位'}`};

  if(!buying)
    return {k:'none', label:'籌碼不足', why:'投信買超天數不夠，還看不出建倉'};

  if(!early)
    return {k:'none', label:'位階不符', why:`目前是「${m.pattern}」，不在打底／剛突破／剛站回均線這三種`};

  if(!noDump)
    return {k:'warn', label:'外資對倒', why:`投信在買但外資近 5 日賣 ${m.f5sellDays} 天且淨賣超，可能是投信在接盤`};

  return {k:'hold', label:'續抱', why:`投信仍在買，站在${m.supName || '支撐'}之上，但已漲 ${fmt(m.runPct,1)}%，不宜再加碼`};
}

function sparkline(code){
  const p = DATA.px[code], q = DATA.ins[code];
  if(!p) return '';
  const c = p.c, n = c.length, W = 520, H = 60, pad = 4;
  const vals = c.filter(x => x !== null);
  if(vals.length < 3 || n < 2) return '';
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx-mn)||1;
  let d = '', started = false, marks = '';
  for(let i=0;i<n;i++){
    if(c[i] === null) continue;
    const x = pad + i/(n-1)*(W-2*pad);
    const y = H - pad - (c[i]-mn)/rg*(H-2*pad);
    d += (started ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1);
    started = true;
    if(q && q.t[i] !== null && q.t[i] > 0)
      marks += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.2" fill="var(--trust)"/>`;
  }
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
    <path d="${d}" fill="none" stroke="var(--dim)" stroke-width="1.4"/>${marks}</svg>
    <div style="font-size:11px;color:var(--dim2)">近 ${n} 個交易日收盤走勢，紫點是投信買超的日子</div>`;
}

}

function valBlock(r){
  const V = r.V;
  if(V.epsTTM === null && V.mcap === null)
    return `<div class="ax" style="margin-bottom:10px"><div class="axh"><span>估值</span></div>
      <div style="font-size:11.5px;color:var(--dim)">交易所沒給這檔的本益比與股價淨值比（多半是近四季合計虧損，本益比不適用），所以算不出合理價。</div></div>`;

  const row = (k, v, s) => `<div class="part"><div class="pt1"><span>${k}</span><em>${v}</em></div>
    ${s ? `<div style="color:var(--dim2);font-size:10.5px">${s}</div>` : ''}</div>`;

  let fair = `<div style="font-size:11.5px;color:var(--dim)">合理價算不出來：${V.bandWhy || '資料不足'}</div>`;
  if(V.lo !== null){
    const pos = Math.max(0, Math.min(100, (r.px - V.lo) / ((V.hi - V.lo) || 1) * 100));
    fair = `
      <div style="font-size:20px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums">
        ${fmt(V.lo,1)} ～ ${fmt(V.hi,1)}<span style="font-size:12px;color:var(--dim);font-weight:600"> 元</span></div>
      <div style="font-size:11.5px;color:var(--dim);margin-bottom:6px">中位 ${fmt(V.mid,1)} 元　·　
        現價 ${fmt(r.px,2)} 元　·　
        <b class="${r.prem>0?'pos':'neg'}">${r.prem>0?'溢價':'折價'} ${fmt(Math.abs(r.prem),1)}%</b></div>
      <div style="position:relative;height:8px;background:linear-gradient(90deg,#12301f,#2a323d,#3a1f24);border-radius:4px">
        <i style="position:absolute;left:${pos}%;top:-3px;width:2px;height:14px;background:var(--tx);border-radius:1px"></i>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim2);margin-top:2px">
        <span>便宜 ${fmt(V.lo,1)}</span><span>貴 ${fmt(V.hi,1)}</span></div>`;
  }

  return `<div class="axes"><div class="ax">
      <div class="axh"><span>合理價區間</span><span style="font-weight:400;color:var(--dim2);font-size:10.5px">
        同業本益比四分位</span></div>${fair}
      <div style="font-size:10.5px;color:var(--dim2);margin-top:6px">
        取樣 ${V.bandSrc || '—'}　·　本益比 P25 ${fmt(V.band&&V.band.p25,1)} ／ 中位 ${fmt(V.band&&V.band.p50,1)} ／ P75 ${fmt(V.band&&V.band.p75,1)}</div>
    </div>
    <div class="ax"><div class="axh"><span>規模與每股數字</span></div><div class="parts">
      ${row('市值', V.mcap===null ? '—' : Math.round(V.mcap).toLocaleString() + ' 億元',
            V.shares ? `股數 ${(V.shares/1e8).toFixed(2)} 億股 × 收盤 ${fmt(r.px,2)}` : '缺實收資本額，算不出來')}
      ${row('近四季 EPS', fmt(V.epsTTM,2) + ' 元', V.pe ? `由交易所本益比 ${fmt(V.pe,2)} 反推：收盤 ÷ 本益比` : '')}
      ${row('每股淨值', fmt(V.bvps,2) + ' 元', V.pb ? `由股價淨值比 ${fmt(V.pb,2)} 反推` : '')}

/* ---------- 資料源面板 ---------- */
function renderProbe(){
  const out = document.getElementById('probeOut');
  const live = [
    {name:'三大法人買賣超日報（可指定日期）', url:'https://www.twse.com.tw/rwd/zh/fund/T86?date=YYYYMMDD&selectType=ALL&response=json'},
    {name:'全市場每日收盤行情（可指定日期）', url:'https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX?date=YYYYMMDD&type=ALL&response=json'}
  ];
  const fails = PROBE._fails || [];
  out.innerHTML =
    (fails.length ? `<div class="ep"><h4>上次執行的失敗訊息 <span class="pill bad">${fails.length}</span></h4>
      <div class="kv">${fails.slice(0,50).map(x=>`<b>·</b><span>${x}</span>`).join('')}</div></div>` : '') +
    live.map(ep => `<div class="ep">
      <h4>${ep.name} <span class="pill ${DATA.dates.length?'ok':'wait'}">${DATA.dates.length?'已取得 '+DATA.dates.length+' 天':'未執行'}</span></h4>
      <div class="epurl">${ep.url}</div></div>`).join('') +
    FUND_EPS.map(ep => {
      const p = PROBE[ep.id];
      let pill = '<span class="pill wait">未測試</span>';
      if(p && p.ok) pill = (p.via === 'direct')
        ? '<span class="pill ok">直連成功</span>' : `<span class="pill px">靠代理（${p.via}）</span>`;
      else if(p) pill = '<span class="pill bad">失敗</span>';
      let body = '';
      if(p && p.ok){
        const s = p.sample || {};
        const mb = p.bytes ? (p.bytes/1048576).toFixed(2) : null;
        const big = p.bytes && p.bytes > 1048576;
        body = `<div style="font-size:12px;color:var(--dim);margin-bottom:4px">
            回傳 <b style="color:var(--tx)">${p.count}</b> 筆
            ${mb ? `　·　<b style="color:${big?'var(--accent)':'var(--tx)'}">${mb} MB</b>${big?'（超過 corsproxy 免費上限 1MB）':''}` : ''}
            ${p.viaName ? '　·　'+p.viaName : ''}${p.ms ? '　·　'+p.ms+'ms' : ''}
            ${p.st ? `　·　認得代號 ${p.st.coded} 筆／抽到值 <b style="color:${p.st.valued?'#8fe0ad':'#ff9d9d'}">${p.st.valued}</b> 筆` : ''}
          </div>
          <div class="kv">${Object.keys(s).map(k=>`<b>${k}</b><span>${String(s[k]).slice(0,90)}</span>`).join('')}</div>`;
      } else if(p) body = `<div style="color:#ff9d9d;font-size:12px">${p.err}</div>`;
      return `<div class="ep"><h4>${ep.name} ${pill}
        <button class="btn" data-ep="${ep.id}" style="font-size:11px;padding:3px 9px;margin-left:auto">單獨重試</button></h4>
        <div class="epurl">${ep.url}</div>${body}</div>`;
    }).join('');

  out.querySelectorAll('button[data-ep]').forEach(b => {
    b.onclick = async () => {
      const ep = FUND_EPS.find(e => e.id === b.dataset.ep);
      b.disabled = true;
      setStatus(`單獨重試：${ep.name}`, true);
      const t0 = Date.now();
      try{
        const {data, via, viaName, bytes} = await getJSON(ep.url);
        if(!Array.isArray(data)) throw new Error('回傳不是陣列');
        const st = ingestFund(ep, data);
        PROBE[ep.id] = {ok:true, via, viaName, bytes, ms:Date.now()-t0, count:data.length, sample:data[0]||null, st};
        setStatus(`${ep.name}：${data.length} 筆，抽到 ${st.valued} 筆有效值，${(bytes/1048576).toFixed(2)} MB，走 ${viaName}`, false, st.valued===0);
        if(st.valued > 0){ DATA.fundAt = Date.now(); cacheSave(); score(); }
      }catch(e){
        PROBE[ep.id] = {ok:false, err:String(e.message||e), ms:Date.now()-t0};
        setStatus(`${ep.name} 失敗：${e.message}`, false, true);
      }
      renderProbe();
    };
  });
}

async function probeAll(){
  const btn = document.getElementById('btnProbe');
  btn.disabled = true;
  const fails = [];
  for(const d of backDates(3).reverse()){
    setStatus(`探測 T86 / MI_INDEX（${d}）…`, true);
    let ok = false;
    try{ if(await fetchInst(d)) ok = true; }catch(e){ fails.push(`T86 ${d}：${e.message}`); }
    try{ if(await fetchPx(d)) ok = ok && true; }catch(e){ fails.push(`MI_INDEX ${d}：${e.message}`); }
    if(ok) break;                                   // 找到一個有資料的交易日就夠
  }
  for(let i=0;i<FUND_EPS.length;i++){
    const ep = FUND_EPS[i];
    setStatus(`探測 ${i+1}/${FUND_EPS.length}：${ep.name}`, true, false, Math.round(i/FUND_EPS.length*100));
    try{
      const {data, via} = await getJSON(ep.url);
      PROBE[ep.id] = {ok:true, via, count:Array.isArray(data)?data.length:0,
                      sample:Array.isArray(data)?data[0]:data};
    }catch(e){
      PROBE[ep.id] = {ok:false, err:String(e.message||e)};
      fails.push(`${ep.name}：${e.message}`);
    }
    renderProbe();
  }
  PROBE._fails = fails;
  renderProbe();
  setStatus(fails.length ? `探測完成，<span style="color:#ff9d9d">${fails.length} 項失敗</span>，訊息在下面。`
                         : '探測完成，全部都通。', false);
  btn.disabled = false;
}
